                    html += `<span class="chord-label" data-line-idx="${lineIdx}" data-chord-idx="${chordIdx}" style="left:${(frac * 100).toFixed(3)}%">${escapeHtml(cp.chord)}</span>`;
                });
                html += '</div>';
                html += '</div>';
                html += '<div class="sheet-lyric">&nbsp;</div>';
                html += '</div>';
                out += html;
            }
            return out || `<div class="sheet-line" data-line-idx="${lineIdx}"><div class="sheet-lyric">&nbsp;</div></div>`;
        }

        // For lines that DO have lyrics: chords are pinned to the exact
        // lyric character they were written next to (same "ch" coordinate
        // space .sheet-lyric renders in, so they line up in the DOM), rather
        // than an evenly-spaced fixed-width box. A quarter/half-measure tick
        // that lands exactly on a real chord uses that chord's own position;
        // one that falls between two chords with nothing tagged there is
        // placed proportionally between their two positions (the midpoint,
        // when there's exactly one such gap - e.g. the .25 between a .0 and
        // .5 chord). When that gap crosses a line break - the next real
        // chord is on a later line - the tick is drawn at the very start of
        // that later (carry-over) line instead of interpolated mid-air
        // across two different lines.
        function computeGridTicks(timing) {
            const anchors = [];
            // A {x_cpl_m:0} chord is a carry-over marker, not a new timed
            // event - excluded entirely from anchor/interpolation
            // computation, and its exact position is recorded here so ANY
            // tick that would still land there (including a cross-line
            // "carry the grid across the break" tick, which lands at the
            // start of whatever line it's on and would otherwise coincide
            // with a marker sitting at the start of its line) gets
            // suppressed too.
            const suppressedByLine = new Map();
            for (const lt of timing.lineTimings) {
                if (!lt.hasLyric) continue;
                for (const cp of lt.chordPositions) {
                    if (cp.measureDuration === 0) {
                        if (!suppressedByLine.has(lt.lineIdx)) suppressedByLine.set(lt.lineIdx, []);
                        suppressedByLine.get(lt.lineIdx).push(cp.charIndex);
                        continue;
                    }
                    anchors.push({ lineIdx: lt.lineIdx, charIndex: cp.charIndex, measurePosition: cp.measurePosition });
                }
            }
            anchors.sort((a, b) => a.measurePosition - b.measurePosition);

            const ticksByLine = new Map();
            // measureNumber is 1-based (measurePosition itself is 0-based -
            // the song's very first measure) and only meaningful when
            // isMeasure is true; carried on every tick regardless since
            // it's cheap and callers only read it for measure ticks.
            const addTick = (lineIdx, leftCh, isMeasure, measureNumber) => {
                const suppressed = suppressedByLine.get(lineIdx);
                if (suppressed && suppressed.some((s) => Math.abs(s - leftCh) < 1e-6)) return;
                if (!ticksByLine.has(lineIdx)) ticksByLine.set(lineIdx, []);
                ticksByLine.get(lineIdx).push({ leftCh, isMeasure, measureNumber });
            };

            anchors.forEach((a) => {
                const isMeasure = Math.abs(a.measurePosition - Math.round(a.measurePosition)) < 1e-6;
                addTick(a.lineIdx, a.charIndex, isMeasure, Math.round(a.measurePosition) + 1);
            });

            for (let i = 0; i < anchors.length - 1; i++) {
                const prev = anchors[i];
                const next = anchors[i + 1];
                const span = next.measurePosition - prev.measurePosition;
                if (span <= 0) continue;
                const prevStep = Math.round(prev.measurePosition * 4);
                const nextStep = Math.round(next.measurePosition * 4);
                for (let step = prevStep + 1; step < nextStep; step++) {
                    const q = step / 4;
                    const isMeasure = step % 4 === 0;
                    if (prev.lineIdx === next.lineIdx) {
                        // This tick's horizontal position is only a linear
                        // guess - proportional distance between two real
                        // chords' character positions, standing in for a
                        // sub-beat this song has no actual timing data for
                        // (no chord change happens here at all). Labeling a
                        // guessed position with a definite-looking measure
                        // number reads as flatly wrong when the guess lands
                        // somewhere that doesn't correspond to any natural
                        // reading rhythm - so the tick mark itself still
                        // shows (still a useful rough rhythm reference), but
                        // no number.
                        const frac = (q - prev.measurePosition) / span;
                        addTick(prev.lineIdx, prev.charIndex + frac * (next.charIndex - prev.charIndex), isMeasure, null);
                    } else {
                        // A tick "carried" to the very start of the next
                        // line, because the gap between chords spans a line
                        // break, IS worth labeling - "this line begins in
                        // measure N" is exactly the standard sheet-music
                        // convention of printing a measure number at the
                        // start of every system, not a guessed position.
                        addTick(next.lineIdx, 0, isMeasure, Math.round(q) + 1);
                    }
                }
            }

            return ticksByLine;
        }

        function buildLyricAnchoredGridHTML(line, chordPositions, ticks, lineIdx, maxChars) {
            const ranges = wrapTextRanges(line.lyric, maxChars);
            const chordBuckets = bucketByRange(chordPositions, ranges, (cp) => cp.charIndex);
            const tickBuckets = bucketByRange(ticks, ranges, (t) => t.leftCh);

            let out = '';
            ranges.forEach((range, segIdx) => {
                const segLyric = line.lyric.slice(range.start, range.end);
                const width = Math.max(segLyric.length, 1);

                let html = `<div class="sheet-line" data-line-idx="${lineIdx}">`;
                html += `<div class="sheet-grid" style="width:${width}ch">`;

                html += '<div class="sheet-ticks">';
                for (const { item: t, localPos } of tickBuckets[segIdx]) {
                    html += `<span class="tick ${t.isMeasure ? 'tick-measure' : 'tick-quarter'}" style="left:${localPos.toFixed(2)}ch"></span>`;
                }
                html += '</div>';

                // computeGridTicks "carries" every intermediate measure
                // boundary that falls in a gap crossing a line break to the
                // very start (position 0) of the next line, since there's
                // no real anchor to interpolate a distinct position from -
                // several different measure numbers can pile up at that
                // same spot. Only the most advanced (last) one per unique
                // position is worth a label; showing all of them stacked on
                // top of each other just reads as scattered/misaligned.
                const numberByPos = new Map();
                for (const { item: t, localPos } of tickBuckets[segIdx]) {
                    if (t.isMeasure && t.measureNumber != null) numberByPos.set(Math.round(localPos * 100), t.measureNumber);
                }
                let numbersHtml = '';
                for (const [posKey, num] of numberByPos) {
                    numbersHtml += `<span class="tick-measure-number" style="left:${(posKey / 100).toFixed(2)}ch">${num}</span>`;
                }
                html += `<div class="sheet-measure-numbers">${numbersHtml}</div>`;

                html += '<div class="sheet-chords-grid">';
                for (const { item: cp, origIdx, localPos } of chordBuckets[segIdx]) {
                    html += `<span class="chord-label" data-line-idx="${lineIdx}" data-chord-idx="${origIdx}" style="left:${localPos}ch">${escapeHtml(cp.chord)}</span>`;
                }
                html += '</div>';

                html += '</div>';
                html += `<div class="sheet-lyric">${segLyric ? escapeHtml(segLyric) : '&nbsp;'}</div>`;
                html += '</div>';
                out += html;
            });
            return out;
        }

        // Classic (non-mark-time) annotation, wrapped: the chord-text row
        // and lyric row are two independent monospace strings sharing the
        // same character columns, so they must be sliced at the SAME
        // wrap boundaries (word boundaries in the lyric) to stay in sync -
        // ordinary per-element CSS wrap would let them drift apart. A
        // trailing instrumental chord run past the end of the lyric text
        // is included by padding the lyric out to the chord line's length
        // before computing wrap points.
        function buildClassicLineHTML(line, lineIdx, maxChars) {
            const chordLine = buildChordLine(line.chords) || '';
            const textLen = Math.max(line.lyric.length, chordLine.length);
            const paddedLyric = line.lyric.length < textLen
                ? line.lyric + ' '.repeat(textLen - line.lyric.length)
                : line.lyric;
            const ranges = wrapTextRanges(paddedLyric, maxChars);

            let out = '';
            ranges.forEach((range) => {
                const segLyric = line.lyric.slice(range.start, Math.min(range.end, line.lyric.length));
                const segChords = chordLine.slice(range.start, range.end).replace(/\s+$/, '');
                let html = `<div class="sheet-line" data-line-idx="${lineIdx}">`;
                if (segChords) html += `<div class="sheet-chords">${escapeHtml(segChords)}</div>`;
                html += `<div class="sheet-lyric">${segLyric ? escapeHtml(segLyric) : '&nbsp;'}</div>`;
                html += '</div>';
                out += html;
            });
            return out;
        }

        // Index (in the same lineIdx sequence buildSongHTML/timing.lineTimings
        // use - i.e. counting only 'line'-type entries, across all non-tab
        // sections) of the first line that actually has a chord tag on it.
        // Returns -1 if the song has no chords anywhere, in which case
        // nothing counts as "before the first chord" and everything renders
        // as normal.
        function findFirstChordedLineIndex(song) {
            let idx = 0;
            for (const section of song.sections) {
                for (const line of section.lines) {
                    if (line.type !== 'line') continue;
                    if (line.chords.length > 0) return idx;
                    idx++;
                }
            }
            return -1;
        }

        // The natural (unwrapped) width, in "ch" units, of the widest line
        // the print output would render - mirrors buildSongHTML's own line
        // walk (same firstChordedLineIdx skip, same lineIdx bookkeeping)
        // but only measures instead of building HTML. Used to shrink the
        // print font to fit instead of word-wrapping (see getPrintFontSizePt).
        function computeMaxPrintLineChars(song, timing, markTime) {
            const firstChordedLineIdx = findFirstChordedLineIndex(song);
            let lineIdx = 0;
            let maxChars = 0;
            for (const section of song.sections) {
                for (const line of section.lines) {
                    if (line.type !== 'line') continue;
                    if (firstChordedLineIdx >= 0 && lineIdx < firstChordedLineIdx) {
                        lineIdx++;
                        continue;
                    }
                    const lt = timing.lineTimings[lineIdx];
                    const hasChords = markTime
                        ? (lt && lt.chordPositions.length > 0)
                        : line.chords.length > 0;

                    let width;
                    if (hasChords && markTime && !lt.hasLyric) {
                        const measuresSpanned = lt.measureEnd - lt.measureStart;
                        width = Math.round(measuresSpanned * 4) * QUARTER_TICK_SPACING_CH;
                    } else if (hasChords && !markTime) {
                        const chordLine = buildChordLine(line.chords) || '';
                        width = Math.max(line.lyric.length, chordLine.length);
                    } else {
                        width = line.lyric.length;
                    }
                    if (width > maxChars) maxChars = width;
                    lineIdx++;
                }
            }
            return maxChars;
        }

        function buildSongHTML(song, timing, markTime, maxChars) {
            let html = '<div class="sheet-header">';
            if (song.title) html += `<div class="sheet-title">${escapeHtml(song.title)}</div>`;
            if (song.subtitle) html += `<div class="sheet-subtitle">${escapeHtml(song.subtitle)}</div>`;
            const meta = [];
            if (song.artist) meta.push(escapeHtml(song.artist));
            if (song.key) meta.push('Key: ' + escapeHtml(song.key));
            if (song.capo) meta.push('Capo: ' + escapeHtml(song.capo));
            if (meta.length) html += `<div class="sheet-meta">${meta.join(' &middot; ')}</div>`;
            html += '</div>';

            let firstChordedLineSeen = false;
            let lineIdx = 0;
            const gridTicksByLine = markTime ? computeGridTicks(timing) : null;
            // Any plain text/blank line before this point has no chord tag
            // of its own and precedes the song's first one - typically
            // leftover boilerplate from a pasted tab-site dump, not real
            // song content - so it's skipped entirely in this rendered
            // output (the underlying text buffers are untouched; this is
            // view-only). Directive-bearing lines (comments, section
            // labels) are left alone regardless of position, since they
            // ARE chordpro/chordplayer tags, just not chord ones.
            const firstChordedLineIdx = findFirstChordedLineIndex(song);

            for (const section of song.sections) {
                html += `<div class="sheet-section sheet-section-${section.type}">`;
                if (section.label) html += `<div class="sheet-section-label">${escapeHtml(section.label)}</div>`;

                {
                    // Consecutive 'tabline' entries (real ASCII notation -
                    // see parseChordPro) are grouped into one <pre> block so
                    // their columns stay visually aligned as a group, same
                    // as before this function handled 'line' entries mixed
                    // into a tab section too; flushed whenever a non-tabline
                    // entry interrupts the run, or at the section's end.
                    let tabBuffer = [];
                    const flushTabBuffer = () => {
                        if (!tabBuffer.length) return;
                        html += `<pre class="sheet-tab">${tabBuffer.join('\n')}</pre>`;
                        tabBuffer = [];
                    };

                    let lastWasBlank = false;
                    for (const line of section.lines) {
                        if (line.type === 'tabline') {
                            tabBuffer.push(escapeHtml(line.text));
                            continue;
                        }
                        flushTabBuffer();

                        if (line.type === 'blank') {
                            if (firstChordedLineIdx >= 0 && lineIdx < firstChordedLineIdx) continue;
                            if (!lastWasBlank) html += '<div class="sheet-spacer"></div>';
                            lastWasBlank = true;
                            continue;
                        }
                        lastWasBlank = false;

                        if (line.type === 'comment') {
                            html += `<div class="sheet-comment">${escapeHtml(line.text)}</div>`;
                            continue;
                        }

                        if (firstChordedLineIdx >= 0 && lineIdx < firstChordedLineIdx) {
                            lineIdx++;
                            continue;
                        }

                        const lt = timing.lineTimings[lineIdx];
                        const hasChords = markTime
                            ? (lt && lt.chordPositions.length > 0)
                            : line.chords.length > 0;

                        if (!firstChordedLineSeen && hasChords) {
                            html += '<div class="sheet-spacer"></div>';
                            firstChordedLineSeen = true;
                        }

                        if (hasChords) {
                            if (markTime) {
                                if (lt.hasLyric) {
                                    html += buildLyricAnchoredGridHTML(line, lt.chordPositions, gridTicksByLine.get(lineIdx) || [], lineIdx, maxChars);
                                } else {
                                    html += buildEvenGridHTML(lt, lineIdx, maxChars);
                                }
                            } else {
                                html += buildClassicLineHTML(line, lineIdx, maxChars);
                            }
                        } else {
                            // No chords at all on this line - no character-
                            // position alignment to preserve, so ordinary
                            // CSS wrapping (see .sheet-lyric-wrap) handles
                            // it directly instead of going through the
                            // character-budget wrap math above.
                            html += `<div class="sheet-line" data-line-idx="${lineIdx}"><div class="sheet-lyric sheet-lyric-wrap">${line.lyric ? escapeHtml(line.lyric) : '&nbsp;'}</div></div>`;
                        }
                        lineIdx++;
                    }
                    flushTabBuffer();
                }
                html += '</div>';
            }
            return html;
        }

        function buildLegendHTML(chordNames, opts) {
            if (!chordNames.length) {
                return '<div class="legend-missing">No chords found.</div>';
            }
            // Chords with no diagram sink to the bottom - everything else
            // keeps its incoming (alphabetical) order, so this only ever
            // reorders across that one boundary, never within either group.
            const hasDiagram = (name) => !!(chordNameVoicingsIndex[name] || chordNameVoicingsIndex[normalizeChordName(name)]);
            const orderedNames = [...chordNames].sort((a, b) => (hasDiagram(a) ? 0 : 1) - (hasDiagram(b) ? 0 : 1));

            const gridClass = chordNames.length <= 7 ? 'legend-grid-1' : 'legend-grid-2';
            let html = `<div class="legend-grid ${gridClass}">`;
            for (const name of orderedNames) {
                const voicings = chordNameVoicingsIndex[name] || chordNameVoicingsIndex[normalizeChordName(name)];
                const cyclable = voicings && voicings.length > 1;
                const voicingIdx = cyclable ? ((legendVoicingIndex[name] || 0) % voicings.length) : 0;
                const voicing = voicings ? voicings[voicingIdx] : null;
                html += `<div class="legend-cell${cyclable ? ' legend-cell-cyclable' : ''}" data-chord-name="${escapeHtml(name)}">`;
                if (voicing) {
                    const svg = drawChordDiagram(voicing, 'standard', opts.showNoteNames, false, opts.monochrome);
                    // drawChordDiagram draws a sub-label (position/shape, e.g.
                    // "Open" or "A-shape barre") under the chord name - not wanted
                    // on the songsheet legend, so strip just that text node out.
                    const positionLabel = voicing[9];
                    if (positionLabel) {
                        for (const t of svg.querySelectorAll('text')) {
                            if (t.textContent === positionLabel) {
                                t.remove();
                                break;
                            }
                        }
                        // drawChordDiagram reserves fixed vertical space for the
                        // label whether or not it's drawn, so removing just the
                        // text leaves a gap. Close it by shifting everything below
                        // the chord-name title up, then trimming the viewBox to match.
                        const SHIFT = 25;
                        const titleEl = svg.firstElementChild;
                        const rest = Array.from(svg.children).filter(el => el !== titleEl);
                        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                        g.setAttribute('transform', `translate(0, -${SHIFT})`);
                        rest.forEach(el => g.appendChild(el));
                        svg.appendChild(g);
                        const vb = svg.getAttribute('viewBox').split(' ').map(Number);
                        vb[3] -= SHIFT;
                        svg.setAttribute('viewBox', vb.join(' '));
                    }
                    html += `<div class="legend-diagram">${svg.outerHTML}</div>`;
                    if (cyclable) {
                        html += `<div class="legend-voicing-badge">${voicingIdx + 1}/${voicings.length}</div>`;
                    }
                    if (opts.showIntervals) {
                        html += `<div class="legend-intervals">${voicing[2].join(' ')}</div>`;
                    }
                } else {
                    html += `<div class="legend-chord-name">${escapeHtml(name)}</div>`;
                    html += '<div class="legend-missing">No diagram</div>';
                }
                html += '</div>';
            }
            html += '</div>';
            return html;
        }

        // Chords already this simple (plain major/minor triad, power chord,
        // dominant/minor 7th, sus2/sus4, all root-position/no altered bass) are
        // left alone. Anything more complex - 9ths/11ths/13ths, add-chords,
        // dim/aug, maj7, altered bass, etc. - gets reduced to root + quality
        // (+ a b7 if the original had one), which is the simplest substitute
        // that still keeps the chord's major/minor/dominant-7 character.
        function simplifyChordName(name) {
            const voicing = chordNameIndex[name] || chordNameIndex[normalizeChordName(name)];
            if (!voicing) return name;

            const intervals = voicing[3];
            const root = voicing[5];
            const hasSlash = name.includes('/');
            const has3 = intervals.includes('3');
            const hasB3 = intervals.includes('b3');
            const has5 = intervals.includes('5');
            const hasB7 = intervals.includes('b7');

            const isPower = intervals.length === 2 && intervals.includes('1') && has5;
            const isSus2 = !hasSlash && intervals.length === 3 && intervals.includes('2') && has5 && !has3 && !hasB3;
            const isSus4 = !hasSlash && intervals.length === 3 && intervals.includes('4') && has5 && !has3 && !hasB3;
            const isPlainTriad = !hasSlash && intervals.length === 3 && has5 && (has3 !== hasB3);
            const isSimple7 = !hasSlash && intervals.length === 4 && has5 && hasB7 && (has3 !== hasB3);

            if (isPower || isSus2 || isSus4 || isPlainTriad || isSimple7) {
                return name; // already simple, leave as-is
            }

            let simplified = root;
            if (hasB3) simplified += 'm';
            if (hasB7) simplified += '7';
            return simplified;
        }

        function applySimplification(song) {
            return {
                ...song,
                sections: song.sections.map(section => {
                    return {
                        ...section,
                        lines: section.lines.map(line => {
                            if (line.type !== 'line') return line;
                            return {
                                ...line,
                                chords: line.chords.map(c => ({ ...c, chord: simplifyChordName(c.chord) })),
                            };
                        }),
                    };
                }),
            };
        }

        let currentSong = null;
        let currentChordNames = [];

        function collectChordNames(song) {
            const seen = new Set();
            const names = [];
            for (const section of song.sections) {
                for (const line of section.lines) {
                    if (line.type !== 'line') continue;
                    for (const c of line.chords) {
                        // A blanked/silent chord (see deleteChordAt) has no
                        // real name to show a diagram for.
                        if (!c.chord) continue;
                        if (!seen.has(c.chord)) {
                            seen.add(c.chord);
                            names.push(c.chord);
                        }
                    }
                }
            }
            names.sort((a, b) => a.localeCompare(b));
            return names;
        }

        // Whether the Color/B&W segmented control (next to Print diagrams)
        // is set to B&W.
        function isPrintBw() {
            return document.getElementById('printColorBw').checked;
        }

        // The on-screen legend is always in color; the print legend only
        // gets a separately-rendered monochrome version when "B&W" is
        // selected - otherwise it reuses the same color HTML, same as
        // before this option existed.
        function renderLegend() {
            const baseOpts = {
                showNoteNames: document.getElementById('legendShowNotes').checked,
                showIntervals: document.getElementById('legendShowIntervals').checked,
            };
            const colorHtml = buildLegendHTML(currentChordNames, { ...baseOpts, monochrome: false });
            document.getElementById('legendPane').innerHTML = colorHtml;

            document.getElementById('printLegend').innerHTML = isPrintBw()
                ? buildLegendHTML(currentChordNames, { ...baseOpts, monochrome: true })
                : colorHtml;

            updateSheetPaneHeight();
        }

        // Clicking a legend diagram that has more than one voicing cycles
        // to the next one, wrapping back to the first after the last -
        // just advances legendVoicingIndex and re-renders, same as any
        // other legend-affecting toggle.
        document.getElementById('legendPane').addEventListener('click', (e) => {
            const cell = e.target.closest('.legend-cell-cyclable');
            if (!cell) return;
            const name = cell.dataset.chordName;
            const voicings = chordNameVoicingsIndex[name] || chordNameVoicingsIndex[normalizeChordName(name)];
            if (!voicings || voicings.length < 2) return;
            legendVoicingIndex[name] = ((legendVoicingIndex[name] || 0) + 1) % voicings.length;
            renderLegend();
        });

        let currentLineTimings = [];
        let currentChordScheduleFull = [];

        // --- Source / tagged-memory state ---
        //
        // Two buffers live in memory once a song is loaded: `chordProText`
        // (what was pasted/dropped/chosen - never edited in place, except by
        // transposeSong, which rewrites chord names in both buffers) and
        // `chordPlayerText` (a working copy seeded from it via
        // buildTaggedChordPro, editable when "With Time Tags" is selected).
        // The single #rawPane box always displays whichever buffer the
        // sourceView radio currently selects, read-only for Source, editable
        // for With Time Tags; edits only ever touch chordPlayerText.
        // `sourceLoaded` gates that read-only lock - before any song has been
        // rendered the box is still a plain editable paste/type target.
        let chordProText = '';
        let chordPlayerText = '';
        let tagsDirty = false;
        let sourceLoaded = false;

        // Play Chords is only ever meaningful in ChordPlayer+Sheet mode
        // (see syncPaneDisplay, which disables it everywhere else) - its
        // checked state there is remembered across mode switches, rather
        // than forgotten every time the reader steps away to Chordpro/Raw
        // and back - see restorePlayChordsForMode and the playChordsToggle
        // 'change' listener that keeps it updated.
        let lastPlayChordsInSheetMode = true;

        // Save feature - filename/handle bookkeeping. Handles are
        // FileSystemFileHandles (Chrome/Edge only, via drag-drop load or a
        // save-time directory pick - see saveDirHandle/resolveFileHandle
        // below) and are in-memory only - never persisted, so every fresh
        // page load starts over. sourceFileName drives both the source's
        // own save-as suggestion and the derived .chordplayer basename.
        //
        // proFileHandle/cplFileHandle are keyed by *role* (the plain-source
        // target vs. the tagged-.chordplayer target), not by "whichever file was
        // opened" - if what was actually loaded is itself a .chordplayer file
        // (sourceIsCpl), the handle it was opened with belongs to
        // cplFileHandle, and proFileHandle starts empty since there's no
        // known .pro counterpart handle yet (resolved via the save
        // directory on first source save instead). Keeping these distinct
        // is what stops the "ChordPro source" and "ChordPlayer file"
        // checkboxes from ever silently colliding on the same filename/
        // handle when a .chordplayer file was loaded.
        let sourceFileName = null;
        let sourceIsCpl = false;
        let proFileHandle = null;
        let cplFileHandle = null;

        // Scroll speed (and chord playback, while it's available - see
        // syncPaneDisplay, which force-disables "Play chords" outside
        // ChordPlayer view) are driven by chordPlayerText's own real
        // {x_cpl_m:} durations while viewing "ChordPlayer". While viewing
        // plain "Chordpro" instead, there are no duration tags to read at
        // all - so rather than following chordPlayerText's real (possibly
        // very different) durations for a buffer the reader isn't even
        // looking at, every chord in chordProText is flatly assumed to be
        // exactly one measure, tempo-locked and fully predictable, which is
        // what "just follow the tempo, one chord per measure" scrolling
        // means for a plain, untagged chart.
        function computeTaggedTiming() {
            const viewingChordPro = !document.getElementById('sourceViewTagged').checked;
            if (viewingChordPro) {
                if (!chordProText || !chordProText.trim()) return { lineTimings: [], chordSchedule: [] };
                return computeMeasureTiming(parseChordPro(chordProText), 1);
            }
            if (!chordPlayerText || !chordPlayerText.trim()) return { lineTimings: [], chordSchedule: [] };
            const chordDurationMeasures = parseFloat(document.getElementById('chordDurationSelect').value);
            return computeMeasureTiming(parseChordPro(chordPlayerText), chordDurationMeasures);
        }

        const MONO_FONT_FAMILY = "'SF Mono', Menlo, Consolas, 'Courier New', monospace";

        // Measures actual rendered monospace character width via a hidden
        // probe, rather than guessing a px-per-pt ratio - the wrap budget
        // needs to be right, not approximately right, or it just moves the
        // overflow instead of fixing it.
        function measureMonospaceCharWidthPx(fontSizeCss) {
            const probe = document.createElement('span');
            probe.style.position = 'absolute';
            probe.style.visibility = 'hidden';
            probe.style.whiteSpace = 'pre';
            probe.style.fontFamily = MONO_FONT_FAMILY;
            probe.style.fontSize = fontSizeCss;
            probe.style.fontWeight = '700';
            probe.textContent = 'M'.repeat(60);
            document.body.appendChild(probe);
            const width = probe.getBoundingClientRect().width / 60;
            document.body.removeChild(probe);
            return width || 8;
        }

        // Screen wrap budget - measured live from the actual #sheetPane box
        // at render time. Per the "fixed width, not live-reflow" design:
        // this is only recomputed on the next render (loading a song,
        // toggling a setting, etc.), not continuously as the window
        // resizes, so it can just read the pane's current width directly.
        function getScreenWrapMaxChars() {
            const pane = document.getElementById('sheetPane');
            if (!pane) return null;
            const rect = pane.getBoundingClientRect();
            if (!rect.width) return null;
            const styles = getComputedStyle(pane);
            const paddingX = parseFloat(styles.paddingLeft || 0) + parseFloat(styles.paddingRight || 0);
            const availablePx = Math.max(0, rect.width - paddingX);
            const charWidth = measureMonospaceCharWidthPx('15px');
            return Math.max(10, Math.floor(availablePx / charWidth));
        }

        // Print page geometry - the print target (#printBody) is
        // display:none until the browser's own print pass and isn't
        // otherwise measurable, so its available width is approximated
        // from the @page margins set above (standard .75in left/right).
        const PRINT_PAGE_WIDTH_IN = 8.5;
        const PRINT_SIDE_MARGIN_IN = 0.75;
        const PRINT_CSS_DPI = 96;
        const PRINT_BASE_FONT_PT = 13;
        const PRINT_MIN_FONT_PT = 6;

        // Song Sheet print never word-wraps lines (each ChordPro source
        // line stays on one physical line) - instead, if the longest line
        // wouldn't fit the page at the base font size, the whole print
        // output shrinks uniformly to whatever size makes it fit, floored
        // at PRINT_MIN_FONT_PT so it doesn't shrink to the point of being
        // unreadable on a very long stray line.
        function getPrintFontSizePt(maxLineChars) {
            if (!maxLineChars) return PRINT_BASE_FONT_PT;
            const pageContentPx = (PRINT_PAGE_WIDTH_IN - PRINT_SIDE_MARGIN_IN * 2) * PRINT_CSS_DPI;
            const availablePx = Math.max(0, pageContentPx - 8);
            const refCharWidthPx = measureMonospaceCharWidthPx(PRINT_BASE_FONT_PT + 'pt');
            const naturalWidthPx = maxLineChars * refCharWidthPx;
            if (naturalWidthPx <= availablePx) return PRINT_BASE_FONT_PT;
            return Math.max(PRINT_MIN_FONT_PT, PRINT_BASE_FONT_PT * (availablePx / naturalWidthPx));
        }

        function renderOutput() {
            if (!currentSong) return;
            const simplify = document.getElementById('simplifyToggle').checked;
            const displaySong = simplify ? applySimplification(currentSong) : currentSong;
            currentChordNames = collectChordNames(displaySong);

            const chordDurationMeasures = parseFloat(document.getElementById('chordDurationSelect').value);
            const timing = computeMeasureTiming(displaySong, chordDurationMeasures);
            const markTime = document.getElementById('sourceViewTagged').checked;
            const songHTML = buildSongHTML(displaySong, timing, markTime, getScreenWrapMaxChars());
            const scrollTiming = computeTaggedTiming();
            currentLineTimings = scrollTiming.lineTimings;
            currentChordScheduleFull = scrollTiming.chordSchedule;
            // The scroll spacer is appended (not part of songHTML) so it
            // exists only in the live scrollable sheetPane, not in print
            // output. Its height is set at scroll-start time (see
            // ensureScrollSpacer) and reset here on every re-render.
            document.getElementById('sheetPane').innerHTML = songHTML + '<div id="scrollSpacer"></div>';
            activeChordEl = null;
            updateResumeFlashDOM();
            renderLegend();
            updatePrintOutput(displaySong, timing, markTime);
        }

        // Print mirrors whichever view (Raw vs Songsheet) is currently on
        // screen, independent of what's shown live - Raw always prints a
        // plain monospace dump of the active buffer with no legend; Song
        // Sheet prints the song re-rendered at the print page's own wrap
        // budget (screen and print rarely share one - different font size,
        // different available width), with the chord-diagram legend
        // included only if "Include chord diagrams in printout" is checked
        // (the on-screen legend-pane always shows regardless - that
        // checkbox only affects print).
        function updatePrintOutput(displaySong, timing, markTime) {
            const showSheet = document.getElementById('viewModeSheet').checked;
            const printSheet = document.querySelector('.print-sheet');
            printSheet.classList.toggle('print-bw', isPrintBw());
            let fontSizePt = PRINT_BASE_FONT_PT;
            if (showSheet) {
                // maxChars=0: no word-wrapping - every source line stays on
                // its own physical line (see getPrintFontSizePt).
                const printHTML = buildSongHTML(displaySong, timing, markTime, 0);
                document.getElementById('printBody').innerHTML = printHTML;
                const includeDiagrams = document.getElementById('printDiagramsCheck').checked;
                printSheet.classList.toggle('no-legend', !includeDiagrams);
                fontSizePt = getPrintFontSizePt(computeMaxPrintLineChars(displaySong, timing, markTime));
            } else {
                const showTagged = document.getElementById('sourceViewTagged').checked;
                const text = showTagged ? chordPlayerText : chordProText;
                document.getElementById('printBody').innerHTML = `<pre class="print-raw-text">${escapeHtml(text)}</pre>`;
                printSheet.classList.add('no-legend');
            }
            document.getElementById('printFontSizeOverride').textContent = fontSizePt < PRINT_BASE_FONT_PT
                ? `@media print { .sheet-lyric, .sheet-chords, .sheet-grid { font-size: ${fontSizePt.toFixed(2)}pt !important; } }`
                : '';
        }

        // Sizes #rawPane/#sheetPane (the shared .sheet-pane slot) to
        // exactly whatever vertical space actually exists between
        // .chordplayer-bar and .player-bar, via the --pane-height
        // custom property both consume (see their CSS) - rather than a
        // hardcoded calc(100vh - Npx) guess, which drifts stale every time
        // the layout above/below the pane changes. .chordplayer-bar'
        // own height and the (scroll-independent) gap between it and
        // .two-pane are measured directly; .player-bar is position:fixed,
        // so its height is simply subtracted from the viewport regardless
        // of scroll position, but only while it's actually visible (a song
        // hasn't been loaded yet on first render).
        function updateSheetPaneHeight() {
            const settingsBar = document.querySelector('.chordplayer-bar');
            const twoPane = document.querySelector('.two-pane');
            const legendPane = document.getElementById('legendPaneContainer');
            const playerBar = document.getElementById('playerBar');
            if (!settingsBar || !twoPane) return;
            const settingsRect = settingsBar.getBoundingClientRect();
            const gap = twoPane.getBoundingClientRect().top - settingsRect.bottom;
            // .legend-pane sits below #rawPane/#sheetPane in the same
            // column now (full-width strip, not a side-by-side sidebar) -
            // its height has to come out of the lyrics pane's own budget so
            // the diagrams strip lands anchored right above .player-bar
            // instead of pushing the page taller and requiring a scroll
            // past the fixed player bar to reach it.
            const legendHeight = (legendPane && !legendPane.classList.contains('hidden'))
                ? legendPane.getBoundingClientRect().height + 12
                : 0;
            const playerBarHeight = playerBar.classList.contains('visible') ? playerBar.getBoundingClientRect().height : 0;
            const available = window.innerHeight - settingsRect.height - gap - legendHeight - playerBarHeight;
            document.documentElement.style.setProperty('--pane-height', Math.max(200, Math.round(available)) + 'px');
        }
        window.addEventListener('resize', updateSheetPaneHeight);
        updateSheetPaneHeight();

        // Shows/locks #rawPane per the sourceView toggle, and picks
        // which of #rawPane (Raw) / #sheetPane (Songsheet) is
        // visible - the two sit in the same slot in .two-pane and are
        // simply toggled against each other - without touching either
        // in-memory buffer. Play-along chord audio requires an actual
        // tagged/edited source (raw source's timing is just the
        // fixed-duration default, not a meaningful "performance"), so the
        // toggle is only enabled while "ChordPlayer" is selected -
        // clicking a chord's own duration in the sheet is gated the same
        // way (see wireChordLabelClicks).
        function syncPaneDisplay() {
            const showTagged = document.getElementById('sourceViewTagged').checked;
            const showSheet = sourceLoaded && document.getElementById('viewModeSheet').checked;
            const box = document.getElementById('rawPane');
            box.value = showTagged ? chordPlayerText : chordProText;
            box.readOnly = sourceLoaded && !showTagged;
            box.style.display = showSheet ? 'none' : '';
            document.getElementById('sheetPane').style.display = showSheet ? '' : 'none';
            document.getElementById('printDiagramsCheck').disabled = !showSheet;
            // The visual metronome only makes sense against the rendered
            // Sheet view (with its chord/rhythm markers) - hide it while
            // viewing raw ChordPro text instead of leaving it floating
            // over an unrelated pane.
            document.getElementById('beatDisplayPanel').style.display = showSheet ? '' : 'none';

            const playChords = document.getElementById('playChordsToggle');
            playChords.disabled = !showTagged;
            if (!showTagged) playChords.checked = false;

            document.getElementById('sheetPane').classList.toggle('tags-editable', showTagged);
            if (!showTagged) hideDurationPopup();
        }

        // Parses and renders whichever buffer the sourceView toggle currently
        // selects - every option toggle (view mode, chord duration,
        // simplify) goes through this once a song is loaded, so the sheet
        // always reflects the visible pane, including any pending
        // tagged-text edits.
        function renderActive() {
            if (!sourceLoaded) return;
            const showTagged = document.getElementById('sourceViewTagged').checked;
            const text = showTagged ? chordPlayerText : chordProText;
            if (!text || !text.trim()) return;
            currentSong = parseChordPro(text);
            renderOutput();
            syncPaneDisplay();
        }

        // Re-tags the whole song from scratch off the unedited original
        // source, using the current "Chord duration" dropdown as the base
        // duration for every chord - this is what actually makes that
        // control mean something once a song is loaded: with every chord in
        // the tagged buffer already carrying its own explicit {x_cpl_m:D} tag
        // (needed for the duration-only cascade to round-trip), there's no
        // "default" left for the dropdown to influence unless something
        // explicitly regenerates the buffer, which is what this does.
        // Confirms first if there are unsaved tagged-text edits, since a
        // full re-tag discards them, same as loading a new file.
        function regenerateTaggedFromSource() {
            if (!sourceLoaded) return;
            if (tagsDirty && !confirm('You have unsaved edits in "With Time Tags" that will be lost. Re-tag from the original source anyway?')) {
                return;
            }
            const song = parseChordPro(chordProText);
            const chordDurationMeasures = parseFloat(document.getElementById('chordDurationSelect').value);
            const timing = computeMeasureTiming(song, chordDurationMeasures);
            chordPlayerText = buildTaggedChordPro(song, timing);
            tagsDirty = false;
            document.getElementById('sourceViewTagged').checked = true;
            renderActive();
        }

        // Parses a brand new song (paste/drop/file-choose) into both
        // buffers and marks it loaded - everything a fresh load needs
        // EXCEPT which view to actually show it in, which callers decide
        // for themselves (see loadNewSource vs the Sheet/Raw "convert on
        // first choice" handler below) - a file/drop load always wants the
        // Sheet+Chordplayer defaults, but choosing Raw as your very first
        // action should convert into Raw, not bounce you to Sheet. Confirms
        // first if there are unsaved tagged-text edits, since this
        // discards them. Returns false (and does nothing) if there's
        // nothing to load or the user cancels that confirmation.
        function ingestSource(text, meta) {
            if (!text || !text.trim()) return false;
            if (tagsDirty && !confirm('You have unsaved edits in "With Time Tags" that will be lost. Load this new file anyway?')) {
                return false;
            }
            text = normalizeCapoDirective(text);
            text = cleanImportedChordProText(text);

            sourceFileName = (meta && meta.fileName) || null;
            sourceIsCpl = /\.chordplayer$/i.test(sourceFileName || '');
            const loadedHandle = (meta && meta.fileHandle) || null;
            proFileHandle = sourceIsCpl ? null : loadedHandle;
            cplFileHandle = sourceIsCpl ? loadedHandle : null;

            currentSong = parseChordPro(text);
            applyCustomChordDefinitions(currentSong);
            // Any loaded file's existing {x_cpl_m:} tags (or legacy
            // pre-"x_"-prefix {cpl_m:}) are exactly what the user intends -
            // load verbatim into chordPlayerText, no re-parse/rebuild/retag,
            // regardless of extension (a .pro can carry tags too, however
            // rare). chordProText only strips them back out when the load
            // is specifically a .chordplayer file - that's the one case
            // where "the plain counterpart" is a meaningful, distinct thing
            // to want; for any other extension that already has tags,
            // there's no such distinction and both buffers stay identical,
            // so a subsequent Save writes two identical files. A file still
            // using the legacy tag name loads and plays back fine as-is;
            // it only migrates to the new name once something actually
            // edits a chord (any edit re-serializes via buildTaggedChordPro,
            // which always emits the current name), not merely on load/Save.
            // Untagged text (any extension) falls through to auto-tagging,
            // same as always.
            if (/\{(?:x_)?cpl_m:/i.test(text)) {
                chordPlayerText = text;
                chordProText = sourceIsCpl ? stripCplTags(text) : text;
            } else {
                chordProText = text;
                const chordDurationMeasures = parseFloat(document.getElementById('chordDurationSelect').value);
                const timing = computeMeasureTiming(currentSong, chordDurationMeasures);
                chordPlayerText = buildTaggedChordPro(currentSong, timing);
            }
            tagsDirty = false;
            sourceLoaded = true;
            document.getElementById('playChordsToggle').checked = true;
            lastPlayChordsInSheetMode = true;
            resumePointChord = null;
            transposeOffset = 0;
            updateTransposeOffsetLabel();
            return true;
        }

        // Matches a YouTube watch/share/embed URL anywhere in the song text
        // (lyrics line, comment, wherever) and captures the 11-char video ID -
        // see detectAndLoadVideoUrl/updateVideoEmbed below. This is a purely
        // manual reference video (start it, tap-tempo to the beat with
        // #tapTempoBtn, then hit Scroll) - there's no programmatic sync to
        // playback, since YouTube's embed API exposes no way to read back a
        // song's actual tempo/beat grid.
        const YOUTUBE_ID_REGEX = /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/i;

        function extractYouTubeId(text) {
            if (!text) return null;
            const m = text.match(YOUTUBE_ID_REGEX);
            return m ? m[1] : null;
        }

        // YT.Player instance backing #videoEmbedIframe, once the IFrame API
        // script (loaded via <script src="https://www.youtube.com/iframe_api">)
        // has called window.onYouTubeIframeAPIReady and the player's been
        // constructed. Using the real Player API (rather than a bare
        // <iframe src="...embed/ID">) is what makes setPlaybackRate below
        // possible - the panel is too small for YouTube's own gear-icon
        // speed menu to appear, so #videoSpeedSelect drives it directly.
        let ytPlayer = null;
        let ytApiReady = false;
        let pendingVideoId = null;

        // That script is commonly blocked outright by ad-blockers/privacy
        // extensions (it's served from youtube.com, a frequent blocklist
        // target) - if onYouTubeIframeAPIReady never fires within
        // YT_API_TIMEOUT_MS of requesting a video, give up waiting and
        // fall back to a plain, uncontrollable <iframe src="...embed/ID">
        // (see loadVideoAsPlainEmbed) so the video is still watchable, just
        // without the Speed dropdown. Once tripped, every subsequent video
        // load uses the fallback directly rather than re-waiting.
        let useFallbackEmbed = false;
        const YT_API_TIMEOUT_MS = 4000;

        // Custom seek/position slider - YouTube's own progress bar inside
        // the embed is too fiddly to grab precisely at this panel's small
        // size. #videoPositionSlider's range is set to the video's actual
        // duration (known once onReady fires) and kept in sync with
        // playback by polling getCurrentTime() - only while the user isn't
        // actively dragging it, so a poll tick doesn't yank the handle back
        // out from under an in-progress drag.
        let videoPositionInterval = null;
        let videoPositionDragging = false;

        function formatVideoTime(seconds) {
            const s = Math.max(0, Math.floor(seconds));
            return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
        }

        function startVideoPositionPolling() {
            stopVideoPositionPolling();
            videoPositionInterval = setInterval(() => {
                if (!ytPlayer || videoPositionDragging) return;
                const duration = ytPlayer.getDuration();
                const slider = document.getElementById('videoPositionSlider');
                if (duration > 0) slider.max = Math.floor(duration);
                slider.value = Math.floor(ytPlayer.getCurrentTime());
                document.getElementById('videoPositionLabel').textContent = formatVideoTime(ytPlayer.getCurrentTime());
            }, 500);
        }

        function stopVideoPositionPolling() {
            if (videoPositionInterval) {
                clearInterval(videoPositionInterval);
                videoPositionInterval = null;
            }
        }

        function onYouTubeIframeAPIReady() {
            ytApiReady = true;
            if (pendingVideoId) {
                const id = pendingVideoId;
                pendingVideoId = null;
                loadVideoIntoPlayer(id);
            }
        }

        function loadVideoIntoPlayer(id) {
            if (ytPlayer) {
                ytPlayer.loadVideoById(id);
                return;
            }
            ytPlayer = new YT.Player('videoEmbedIframe', {
                videoId: id,
                // origin must match the page's own origin exactly, or the
                // player's postMessage bridge fails auth and playback
                // silently refuses to start (getVideoData().errorCode
                // 'auth', isPlayable false) even though the iframe itself
                // loads fine.
                playerVars: { rel: 0, origin: window.location.origin },
                events: {
                    onReady: () => {
                        document.getElementById('videoSpeedControl').style.display = '';
                        document.getElementById('videoSpeedSelect').value = '1';
                        ytPlayer.setPlaybackRate(1);
                        document.getElementById('videoVolumeControl').style.display = '';
                        ytPlayer.setVolume(parseInt(document.getElementById('videoVolumeSlider').value, 10));
                        document.getElementById('videoPositionControl').style.display = '';
                        startVideoPositionPolling();
                    },
                },
            });
        }

        function loadVideoAsPlainEmbed(id) {
            const container = document.getElementById('videoEmbedIframe');
            container.innerHTML = '';
            const iframe = document.createElement('iframe');
            iframe.src = 'https://www.youtube.com/embed/' + id;
            iframe.allow = 'autoplay; encrypted-media';
            iframe.allowFullscreen = true;
            container.appendChild(iframe);
            document.getElementById('videoSpeedControl').style.display = 'none';
            // A plain <iframe> has no JS handle to control volume/position
            // with - only the JS-API-backed player (above) can drive these.
            document.getElementById('videoVolumeControl').style.display = 'none';
            document.getElementById('videoPositionControl').style.display = 'none';
            stopVideoPositionPolling();
        }

        // Reflects whatever's currently in #youtubeUrlInput into the embed
        // player - shows/hides the frame based on whether the field holds
        // a recognizable YouTube URL. The Speed control's own visibility is
        // handled by whichever load path actually runs (JS-API-backed
        // player vs. plain-embed fallback), not here.
        function updateVideoEmbed() {
            const id = extractYouTubeId(document.getElementById('youtubeUrlInput').value);
            const frame = document.getElementById('videoEmbedFrame');
            if (id) {
                frame.style.display = '';
                if (useFallbackEmbed) {
                    loadVideoAsPlainEmbed(id);
                } else if (ytApiReady) {
                    loadVideoIntoPlayer(id);
                } else {
                    document.getElementById('videoSpeedControl').style.display = 'none';
                    document.getElementById('videoVolumeControl').style.display = 'none';
                    document.getElementById('videoPositionControl').style.display = 'none';
                    pendingVideoId = id;
                    setTimeout(() => {
                        if (!ytApiReady && pendingVideoId === id) {
                            useFallbackEmbed = true;
                            pendingVideoId = null;
                            loadVideoAsPlainEmbed(id);
                        }
                    }, YT_API_TIMEOUT_MS);
                }
            } else {
                frame.style.display = 'none';
                document.getElementById('videoSpeedControl').style.display = 'none';
                document.getElementById('videoVolumeControl').style.display = 'none';
                document.getElementById('videoPositionControl').style.display = 'none';
                stopVideoPositionPolling();
                pendingVideoId = null;
                if (ytPlayer) ytPlayer.stopVideo();
            }
        }

        // Auto-fills the YouTube URL field for the just-loaded song -
        // editable afterward, and cleared out if the new song has neither
        // source (so a previous song's video doesn't linger against the
        // wrong song). Prefers the song's own {x_cpl_v:} tag (see
        // parseChordPro/buildPatchedSource) when present; falls back to
        // scanning the raw lyrics/comments for a bare YouTube link, for
        // songs saved before this tag existed.
        function detectAndLoadVideoUrl(text) {
            const taggedUrl = (currentSong && currentSong.videoUrl) ? currentSong.videoUrl.trim() : '';
            if (taggedUrl) {
                document.getElementById('youtubeUrlInput').value = taggedUrl;
            } else {
                const id = extractYouTubeId(text);
                document.getElementById('youtubeUrlInput').value = id ? ('https://www.youtube.com/watch?v=' + id) : '';
            }
            updateVideoEmbed();
        }

        // Renders the just-ingested song and syncs every control that
        // depends on it - shared tail of loadNewSource and the Sheet/Raw
        // first-choice handler, once each has settled which view/source
        // radios should be checked.
        function finishLoad() {
            renderActive();

            document.getElementById('playerBar').classList.add('visible');
            updateSheetPaneHeight();
            // .player-bar-row was width:0/hidden until now (display:none
            // parent) - the scroll-lock setup's indicator check ran too
            // early to measure it, so re-run it via the same 'resize'
            // listener it's already subscribed to.
            window.dispatchEvent(new Event('resize'));
            document.title = (currentSong.title ? currentSong.title + ' — ' : '') + 'ChordPlayer';
            detectAndLoadVideoUrl(chordProText);

            // Sync the tempo/time-signature controls to the file's own
            // metadata, if it specified any.
            if (currentSong.tempo) {
                const parsed = parseInt(currentSong.tempo, 10);
                if (!isNaN(parsed)) {
                    bpm = parsed;
                    document.getElementById('bpmSlider').value = bpm;
                    updateBpmLabel();
                    resyncMetronomeToBPM();
                }
            }
            if (currentSong.time) {
                const numerator = currentSong.time.split('/')[0];
                const select = document.getElementById('timeSignatureSelect');
                if ([...select.options].some(o => o.value === numerator)) select.value = numerator;
            }
            if (!isScrolling && !isCountingIn) updateBeatDisplay(0, getBeatsPerMeasure());

            songElapsedMeasures = 0;
            scrollStartMeasure = 0;
            document.getElementById('sheetPane').scrollTop = 0;
        }

        // Loads a brand new song from a file/drop/file-choose - always
        // resets to the Sheet+Chordplayer defaults, since there's no
        // existing view choice to respect yet.
        function loadNewSource(text, meta) {
            if (!ingestSource(text, meta)) return;
            document.getElementById('sourceViewTagged').checked = true;
            document.getElementById('viewModeSheet').checked = true;
            finishLoad();
        }

        // Resets everything back to the pre-load "empty paste box" state -
        // so pasting something new afterward reads as starting fresh,
        // rather than editing whatever was loaded before. Confirms first
        // if there are unsaved tagged-text edits, same as loading over top
        // of them would.
        function clearSong() {
            if (tagsDirty && !confirm('You have unsaved edits in "With Time Tags" that will be lost. Clear the loaded song anyway?')) {
                return;
            }
            haltPlayback();

            currentSong = null;
            currentChordNames = [];
            currentLineTimings = [];
            currentChordScheduleFull = [];
            chordProText = '';
            chordPlayerText = '';
            tagsDirty = false;
            sourceLoaded = false;
            sourceFileName = null;
            sourceIsCpl = false;
            proFileHandle = null;
            cplFileHandle = null;
            resumePointChord = null;
            songFinished = false;
            songElapsedMeasures = 0;
            scrollStartMeasure = 0;
            transposeOffset = 0;
            updateTransposeOffsetLabel();

            document.getElementById('rawPane').value = '';
            document.getElementById('sheetPane').innerHTML = '';
            document.getElementById('legendPane').innerHTML = '';
            document.getElementById('viewModeSheet').checked = false;
            document.getElementById('viewModeRaw').checked = false;
            document.getElementById('sourceViewTagged').checked = true;
            document.getElementById('playChordsToggle').checked = false;
            document.getElementById('playerBar').classList.remove('visible');
            document.title = 'ChordPlayer';
            document.getElementById('youtubeUrlInput').value = '';
            updateVideoEmbed();

            updateSheetPaneHeight();
            syncPaneDisplay();
            updateResumeFlashDOM();

            try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}
        }

        // --- Session persistence ---
        //
        // ChordPlayer and ChordTutor are separate pages (the nav bar does a
        // real navigation, not an SPA route), so anything the user has
        // loaded/tweaked would normally vanish the moment they click over
        // to ChordTutor and back. To make that round trip transparent, the
        // full in-memory state - both text buffers plus every durable
        // control - is snapshotted to localStorage right before the page
        // unloads, and replayed back on the next load. Purely a same-
        // browser convenience, not a save/export feature - Save/save-as
        // file handles are never persisted (they can't be serialized), and
        // in-flight playback (scrolling/counting-in) is deliberately not
        // resumed, only settings.
        const SESSION_STORAGE_KEY = 'chordplayer.session.v1';
        const PERSISTED_CONTROL_IDS = [
            'timeSignatureSelect', 'chordDurationSelect', 'simplifyToggle',
            'legendShowNotes', 'legendShowIntervals', 'playChordsToggle',
            'bpmSlider', 'toneSelect', 'strumPatternSelect', 'accentContrastSlider',
            'chordVolumeSlider', 'metronomeVolumeSlider', 'sustainSlider',
            'videoVolumeSlider', 'videoSpeedSelect', 'youtubeUrlInput',
            'printColorColor', 'printColorBw',
        ];

        function saveSessionState() {
            if (!sourceLoaded) return;
            const controls = {};
            for (const id of PERSISTED_CONTROL_IDS) {
                const el = document.getElementById(id);
                if (!el) continue;
                controls[id] = (el.type === 'checkbox' || el.type === 'radio') ? el.checked : el.value;
            }
            const state = {
                chordProText, chordPlayerText, tagsDirty, sourceFileName, sourceIsCpl,
                transposeOffset,
                sourceViewTagged: document.getElementById('sourceViewTagged').checked,
                viewModeSheet: document.getElementById('viewModeSheet').checked,
                controls,
            };
            try { localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        }

        // Re-hydrates a snapshot saved by saveSessionState - restores the
        // two text buffers and bookkeeping vars directly, then re-runs the
        // normal finishLoad tail (same one loadNewSource uses) so rendering,
        // the player bar, and the video embed all come up exactly as they
        // would from a fresh load. Every other control is set and then
        // re-dispatched as a real input/change event, so each control's own
        // existing listener - not this function - does the work of
        // resyncing whatever cached JS state (bpm, metronome, legend
        // options, etc.) it owns.
        function restoreSessionState() {
            let saved;
            try { saved = JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY) || 'null'); } catch (e) { saved = null; }
            if (!saved || !saved.chordProText) return;

            chordProText = saved.chordProText;
            chordPlayerText = saved.chordPlayerText || saved.chordProText;
            currentSong = parseChordPro(chordPlayerText);
            // chordPlayerText's own {define:} tags may have been dropped by
            // a prior auto-tag pass (buildTaggedChordPro doesn't
            // re-serialize them) - chordProText always keeps the originals,
            // so re-derive the custom-chord set from that instead.
            applyCustomChordDefinitions(parseChordPro(chordProText));
            tagsDirty = !!saved.tagsDirty;
            sourceFileName = saved.sourceFileName || null;
            sourceIsCpl = !!saved.sourceIsCpl;
            sourceLoaded = true;
            transposeOffset = saved.transposeOffset || 0;

            document.getElementById('sourceViewTagged').checked = saved.sourceViewTagged !== false;
            document.getElementById('sourceViewSource').checked = saved.sourceViewTagged === false;
            document.getElementById('viewModeSheet').checked = saved.viewModeSheet !== false;
            document.getElementById('viewModeRaw').checked = saved.viewModeSheet === false;

            finishLoad();

            const controls = saved.controls || {};
            for (const id of PERSISTED_CONTROL_IDS) {
                if (!(id in controls)) continue;
                const el = document.getElementById(id);
                if (!el) continue;
                if (el.type === 'checkbox' || el.type === 'radio') el.checked = controls[id];
                else el.value = controls[id];
                el.dispatchEvent(new Event('input', { bubbles: true }));
                el.dispatchEvent(new Event('change', { bubbles: true }));
            }

            updateTransposeOffsetLabel();
        }

        window.addEventListener('pagehide', saveSessionState);
        window.addEventListener('beforeunload', saveSessionState);

        // --- Save ---
        //
        // Patches {time:}/{tempo:} into a copy of a buffer without
        // re-parsing (re-parsing+rebuilding would discard any in-progress
        // {x_cpl_m:} edits sitting in chordPlayerText) - replaces an
        // existing directive line in place, or inserts a new one after the
        // file's leading block of header directives (title/artist/key/
        // etc.) if the file has none yet. {key:}/{capo:} are deliberately
        // left alone - there's no UI control for either, so the app never
        // has an opinion to write for them.
        function upsertDirective(text, name, value) {
            const lines = text.split(/\r?\n/);
            const directiveRe = new RegExp(`^\\{${name}(?::.*)?\\}$`, 'i');
            const idx = lines.findIndex(l => directiveRe.test(l.trim()));
            const newLine = `{${name}: ${value}}`;
            if (idx !== -1) {
                lines[idx] = newLine;
                return lines.join('\n');
            }
            const headerRe = /^\{(title|t|subtitle|st|artist|key|capo|time|tempo|x_cpl_v|cpl_v)(?::.*)?\}$/i;
            let insertAt = 0;
            for (let i = 0; i < lines.length; i++) {
                const trimmed = lines[i].trim();
                if (trimmed === '' || headerRe.test(trimmed)) insertAt = i + 1;
                else break;
            }
            lines.splice(insertAt, 0, newLine);
            return lines.join('\n');
        }

        // Companion to upsertDirective, for a directive that should be
        // dropped entirely rather than written with an empty value - used
        // when the YouTube URL field is cleared, so a stale {x_cpl_v:} tag
        // doesn't linger in the saved file pointing at a video that's no
        // longer set.
        function removeDirective(text, name) {
            const directiveRe = new RegExp(`^\\{${name}(?::.*)?\\}$`, 'i');
            return text.split(/\r?\n/).filter(l => !directiveRe.test(l.trim())).join('\n');
        }

        function getTimeSignatureLabel() {
            const select = document.getElementById('timeSignatureSelect');
            return select.options[select.selectedIndex].textContent.trim();
        }

        // Used when the loaded "source" is itself a .chordplayer file
        // (sourceIsCpl): chordProText (the "Chordpro" pane's own buffer) is
        // a literal strip of just the {x_cpl_m:} tags (or the legacy
        // pre-"x_"-prefix {cpl_m:}) out of the verbatim loaded text - see
        // loadNewSource. No parsing/rebuilding - the file's own tags are
        // taken as exactly what the user intends, so nothing about the
        // text is touched beyond removing the tags themselves.
        function stripCplTags(text) {
            return text.replace(/\{(?:x_)?cpl_m:\s*[^}]*\}/gi, '');
        }

        // Patches the current YouTube URL field into a copy of `text` as an
        // {x_cpl_v:} directive (or strips any existing one, including a
        // legacy pre-"x_"-prefix {cpl_v:}, if the field's empty) - shared
        // tail of buildPatchedSource/buildPatchedTagged. Always removes any
        // legacy-named tag first, so saving migrates it to the current name
        // in place rather than leaving a stale duplicate behind.
        function patchVideoUrl(text) {
            const videoUrl = document.getElementById('youtubeUrlInput').value.trim();
            const migrated = removeDirective(text, 'cpl_v');
            return videoUrl ? upsertDirective(migrated, 'x_cpl_v', videoUrl) : removeDirective(migrated, 'x_cpl_v');
        }

        function buildPatchedSource() {
            // chordProText is already the plain/untagged buffer even
            // for a .chordplayer load (stripped at load time - see
            // loadNewSource) - just patch time/tempo/video on top of it.
            let text = upsertDirective(chordProText, 'time', getTimeSignatureLabel());
            text = upsertDirective(text, 'tempo', document.getElementById('bpmSlider').value);
            return patchVideoUrl(text);
        }

        function buildPatchedTagged() {
            let text = upsertDirective(chordPlayerText, 'time', getTimeSignatureLabel());
            text = upsertDirective(text, 'tempo', document.getElementById('bpmSlider').value);
            return patchVideoUrl(text);
        }

        // Basename shared by both saved files - the loaded file's own name
        // (extension stripped) if known, else a slug of the song title,
        // else a plain fallback. Pasted text with no {title:} of its own
        // has no better source to name itself after.
        function deriveBaseName() {
            if (sourceFileName) return sourceFileName.replace(/\.[^./\\]+$/, '');
            if (currentSong && currentSong.title) {
                const slug = currentSong.title.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
                if (slug) return slug;
            }
            return 'song';
        }

        // A loaded .chordplayer file's own filename is never reused for the "source"
        // save target - .chordplayer isn't a valid plain-source extension, and
        // reusing it verbatim would make both checkboxes resolve to the
        // exact same filename/handle and collide (this was a real bug -
        // see the "Save failed: ChordPlayer file" case).
        function deriveSourceSaveName() {
            if (sourceIsCpl) return deriveBaseName() + '.pro';
            return sourceFileName || (deriveBaseName() + '.pro');
        }

        function deriveCplSaveName() {
            return deriveBaseName() + '.chordplayer';
        }

        async function writeToHandle(handle, text) {
            if (handle.requestPermission) {
                const perm = await handle.requestPermission({ mode: 'readwrite' });
                if (perm !== 'granted') throw new Error('write permission denied');
            }
            const writable = await handle.createWritable();
            await writable.write(text);
            await writable.close();
        }

        function downloadText(filename, text) {
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // The File System Access API only honors ONE picker call (open/save/
        // directory) per click - a second show*Picker call in the same
        // handler is rejected outright because "transient user activation"
        // is consumed by the first one. So a single Save click that needs
        // to establish handles for *two* files (source + .chordplayer, neither
        // saved before) can't use showSaveFilePicker per-file - it would
        // work for the first file and silently fail for the second, which
        // is the bug this replaced. Instead: one showDirectoryPicker() call
        // (memoized in saveDirHandle, kept for the rest of the session, not
        // reset on loading a new song) picks the folder once; every file
        // handle after that comes from dirHandle.getFileHandle(), a plain
        // API call that needs no further user gesture.
        let saveDirHandle = null;

        async function ensureSaveDirHandle() {
            // mode: 'readwrite' grants write permission on the directory
            // itself, up front, in this one dialog - so every file handle
            // created under it (see resolveFileHandle) inherits write
            // access with no further per-file permission prompt. Without
            // this, the directory defaults to read-only: getFileHandle's
            // create:true still creates an empty file on disk, but the
            // separate write-permission request for anything past the
            // first file has no fresh user gesture to ride on and silently
            // never grants - producing an empty file with no error.
            if (!saveDirHandle) saveDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            return saveDirHandle;
        }

        // Resolves the writable handle to save through for one file, by
        // role ('source' = the plain .pro target, 'cpl' = the tagged
        // target) - see the proFileHandle/cplFileHandle comment above for
        // why this is role-keyed rather than "whichever file was opened".
        // An already-established handle wins outright; otherwise gets/
        // creates it inside the (once-prompted) save folder. Returns null
        // when the API isn't available at all, so the caller falls back to
        // a download.
        async function resolveFileHandle(kind, filename) {
            const existing = kind === 'source' ? proFileHandle : cplFileHandle;
            if (existing) return existing;
            if (!fsaSupported) return null;
            const dir = await ensureSaveDirHandle();
            const handle = await dir.getFileHandle(filename, { create: true });
            if (kind === 'source') proFileHandle = handle; else cplFileHandle = handle;
            return handle;
        }

        // Chrome/Edge: silent overwrite via a resolved handle (see above).
        // Anywhere else (Safari, or any browser without the API): a plain
        // download, every time - see the save-feature plan discussed with
        // the user for why that's the ceiling of what's possible there.
        async function saveOneFile(kind, filename, text) {
            let handle;
            try {
                handle = await resolveFileHandle(kind, filename);
            } catch (err) {
                if (err && err.name === 'AbortError') return { ok: false, cancelled: true };
                return { ok: false, error: err };
            }
            if (handle) {
                try {
                    await writeToHandle(handle, text);
                    return { ok: true };
                } catch (err) {
                    return { ok: false, error: err };
                }
            }
            downloadText(filename, text);
            return { ok: true };
        }

        function openSaveDialog() {
            document.getElementById('saveDialogStatus').textContent = '';
            document.getElementById('saveDialogOverlay').classList.add('visible');
        }

        function closeSaveDialog() {
            document.getElementById('saveDialogOverlay').classList.remove('visible');
        }

        async function performSave() {
            const statusEl = document.getElementById('saveDialogStatus');
            const doSource = document.getElementById('saveSourceCheck').checked;
            const doCpl = document.getElementById('saveCplCheck').checked;
            if (!doSource && !doCpl) return;

            statusEl.textContent = 'Saving…';
            const results = [];

            if (doSource) {
                const patched = buildPatchedSource();
                const res = await saveOneFile('source', deriveSourceSaveName(), patched);
                if (res.ok) chordProText = patched;
                results.push({ label: 'ChordPro source', ...res });
            }
            if (doCpl) {
                const patched = buildPatchedTagged();
                const res = await saveOneFile('cpl', deriveCplSaveName(), patched);
                if (res.ok) { chordPlayerText = patched; tagsDirty = false; }
                results.push({ label: 'ChordPlayer file', ...res });
            }

            const failed = results.filter(r => !r.ok && !r.cancelled);
            if (failed.length) {
                failed.forEach(r => console.error('Save failed:', r.label, r.error));
                const detail = failed.map(r => `${r.label} (${r.error && r.error.message ? r.error.message : r.error})`).join(', ');
