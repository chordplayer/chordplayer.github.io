                statusEl.textContent = 'Save failed: ' + detail;
                return;
            }
            if (results.every(r => r.cancelled)) {
                statusEl.textContent = '';
                return;
            }

            syncPaneDisplay();
            closeSaveDialog();
        }

        document.getElementById('saveBtn').addEventListener('click', openSaveDialog);
        document.getElementById('saveCancelBtn').addEventListener('click', closeSaveDialog);
        document.getElementById('saveConfirmBtn').addEventListener('click', performSave);
        document.getElementById('saveDialogOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'saveDialogOverlay') closeSaveDialog();
        });

        document.getElementById('printBtn').addEventListener('click', () => {
            stopScrolling();
            window.print();
        });

        document.getElementById('clearSongBtn').addEventListener('click', clearSong);

        // --- Auto-scroll player ---
        //
        // Two independent behaviors:
        // 1. Page-level: bring the songsheet section to the top of the viewport.
        //    Happens every time Scroll is pressed - a no-op if it's already there.
        // 2. Container-level: the actual reading auto-scroll happens INSIDE
        //    .sheet-pane's own scrollbar (it's a bounded, independently
        //    scrollable box), not the page. Pausing and resuming preserves that
        //    internal position; it only resets to its own top if it had already
        //    reached its own bottom.

        let isScrolling = false;
        let bpm = 100;
        let lastFrameTime = null;

        function updateBpmLabel() {
            document.getElementById('bpmLabel').textContent = bpm + ' BPM';
        }

        // Sets #scrollToggleBtn's label and red "stop" styling together -
        // called from every place that flips it between Scroll/Stop
        // (startScrolling, stopScrolling, startCountIn, haltPlayback) so
        // the two never drift out of sync with each other.
        function setScrollButtonRunning(running) {
            const btn = document.getElementById('scrollToggleBtn');
            btn.innerHTML = running ? '&#9724; Stop' : '&#9654; Scroll';
            btn.classList.toggle('player-btn-stop', running);
        }

        // Chord timing is purely position-based in MEASURE units (see
        // computeMeasureTiming), independent of BPM - a chord's scheduled
        // position is "measure 3.5" regardless of tempo. Elapsed playback
        // position (songElapsedMeasures) advances each frame by
        // dt / currentMeasureDuration, using whatever BPM is live right now.
        // Dragging the tempo slider mid-song doesn't rescale this live,
        // though - see pauseForTempoChange/resumeAfterTempoChange - it
        // pauses playback for the duration of the drag, then re-counts-in
        // and resumes at the new tempo from the start of whatever measure
        // was playing when the drag began.
        let chordSchedule = [];
        let chordScheduleIndex = 0;
        let songElapsedMeasures = 0;
        let currentMeasurePixelMap = [];

        // scrollTopForMeasure() returns an ABSOLUTE pixel position, as if
        // the pane had been auto-scrolling continuously since measure 0 -
        // but scrolling only actually starts once songElapsedMeasures
        // reaches scrollStartMeasure, by which point the pane's real
        // scrollTop is nowhere near that absolute value (it's still
        // wherever the reader left it, typically far less). Without
        // correction, the very first scrolled frame snaps scrollTop
        // straight to the absolute target - a large, jarring jump instead
        // of a smooth continuation. This constant (recomputed once, right
        // before scrolling can first move - see setScrollJumpCorrection)
        // shifts the whole continuous curve down by exactly the gap
        // between "where the formula says we should be" and "where the
        // pane actually is" at that instant, so the first scrolled frame
        // lands exactly on the pane's current position and every frame
        // after moves at the normal tempo-driven rate with zero jump.
        let scrollJumpCorrection = 0;

        function setScrollJumpCorrection(gateMeasure) {
            const sheetPane = document.getElementById('sheetPane');
            const gateTarget = scrollTopForMeasure(gateMeasure);
            scrollJumpCorrection = (gateTarget !== null ? gateTarget : sheetPane.scrollTop) - sheetPane.scrollTop;
        }

        // Offset added to the metronome-tick-driven chord clock (see
        // metronomeTick) so chord playback can resume mid-song after a
        // tempo-change pause, instead of always counting from the song's
        // first measure. 0 for a normal fresh Scroll press.
        let songClockBaseMeasure = 0;

        // Chords start the instant the count-in ends (songElapsedMeasures 0 =
        // the song's own first measure). Scrolling itself doesn't start
        // moving until playback reaches the second-to-last measure that's
        // already visible in the sheet's viewport at scrollTop 0 - so the
        // reader always has one measure of lead-in still on screen before
        // the sheet begins moving, instead of a fixed delay unrelated to how
        // much content actually fits. Computed fresh each play in
        // startScrolling (it depends on the rendered layout and viewport
        // size). Once it does start, it scrolls at normal tempo-driven speed.
        let scrollStartMeasure = 0;

        // Faster strum than the chord-finder page's default - works better
        // for backing-track-style playback than the ring-out-clearly pacing
        // meant for auditioning a single chord. Note duration itself now
        // scales with the Sustain slider (see getNoteDuration) rather than
        // being fixed - PLAYBACK_NOTE_DURATION_MIN/MAX are that range's
        // floor/ceiling.
        const PLAYBACK_STRUM_DELAY = 0.025;
        const PLAYBACK_NOTE_DURATION_MIN = 2.5;
        const PLAYBACK_NOTE_DURATION_MAX = 7;

        function getSelectedTone() {
            return document.getElementById('toneSelect').value;
        }

        function getNonAccentVolume() {
            return parseFloat(document.getElementById('accentContrastSlider').value) / 100;
        }

        function getChordVolume() {
            return parseFloat(document.getElementById('chordVolumeSlider').value) / 100;
        }

        // 0 (short) - 1 (long); interpolates both the tone's own decay (see
        // TONE_PRESETS/playChord in chord-data.js) and the note's overall
        // buffer length below, so a longer decay tail actually has room to
        // ring out instead of getting cut off at the old fixed 3.2s.
        function getSustain() {
            return parseInt(document.getElementById('sustainSlider').value, 10) / 100;
        }

        function getNoteDuration() {
            return PLAYBACK_NOTE_DURATION_MIN + getSustain() * (PLAYBACK_NOTE_DURATION_MAX - PLAYBACK_NOTE_DURATION_MIN);
        }

        function playChordByName(name, direction = 'down', accent = false) {
            const voicing = chordNameIndex[name] || chordNameIndex[normalizeChordName(name)];
            if (voicing) playChord(voicing[1], PLAYBACK_STRUM_DELAY, getNoteDuration(), direction, getSelectedTone(), accent, getNonAccentVolume(), getChordVolume(), getSustain());
        }

        // Maps each rendered line's [measureStart, measureEnd) span to its
        // actual on-screen pixel range within #sheetPane's scrollable content,
        // so playback position (in measures) can be converted directly to a
        // scrollTop. Built once DOM layout is settled, right before scrolling
        // starts.
        function buildMeasurePixelMap() {
            const sheetPane = document.getElementById('sheetPane');
            const paneTop = sheetPane.getBoundingClientRect().top - sheetPane.scrollTop;
            const map = [];
            for (const lt of currentLineTimings) {
                const el = sheetPane.querySelector(`.sheet-line[data-line-idx="${lt.lineIdx}"]`);
                if (!el) continue;
                const pixelTop = el.getBoundingClientRect().top - paneTop;
                map.push({
                    measureStart: lt.measureStart,
                    measureEnd: lt.measureEnd,
                    pixelTop,
                    pixelBottom: pixelTop + el.offsetHeight,
                });
            }
            return map;
        }

        function scrollTopForMeasure(measure) {
            const map = currentMeasurePixelMap;
            if (!map.length) return null;
            if (measure <= map[0].measureStart) return map[0].pixelTop;
            for (const seg of map) {
                if (measure >= seg.measureStart && measure <= seg.measureEnd) {
                    const span = seg.measureEnd - seg.measureStart;
                    const frac = span > 0 ? (measure - seg.measureStart) / span : 0;
                    return seg.pixelTop + frac * (seg.pixelBottom - seg.pixelTop);
                }
            }
            // Past the last rendered line - keep scrolling at the rate the
            // last line established (into the blank spacer below the sheet's
            // actual content) rather than freezing, so scrolling continues
            // until the whole song has finished playing.
            const last = map[map.length - 1];
            const span = last.measureEnd - last.measureStart;
            const rate = span > 0 ? (last.pixelBottom - last.pixelTop) / span : 0;
            return last.pixelBottom + (measure - last.measureEnd) * rate;
        }

        // Inverse of scrollTopForMeasure - which measure sits at a given
        // pixel Y position in the sheet's scrollable content. Used to figure
        // out what's visible at scrollTop 0, before any scrolling starts.
        function measureForPixelY(pixelY) {
            const map = currentMeasurePixelMap;
            if (!map.length) return 0;
            if (pixelY <= map[0].pixelTop) return map[0].measureStart;
            for (let i = 0; i < map.length; i++) {
                const seg = map[i];
                if (pixelY >= seg.pixelTop && pixelY <= seg.pixelBottom) {
                    const span = seg.pixelBottom - seg.pixelTop;
                    const frac = span > 0 ? (pixelY - seg.pixelTop) / span : 0;
                    return seg.measureStart + frac * (seg.measureEnd - seg.measureStart);
                }
                // pixelY sits in the small gap between this line and the
                // next one (see .sheet-line's own margin-bottom) - belongs
                // to wherever this line left off, not the "past the whole
                // song" extrapolation below (which is only for pixelY past
                // the actual last line).
                const next = map[i + 1];
                if (next && pixelY > seg.pixelBottom && pixelY < next.pixelTop) {
                    return seg.measureEnd;
                }
            }
            const last = map[map.length - 1];
            const span = last.measureEnd - last.measureStart;
            const rate = span > 0 ? (last.pixelBottom - last.pixelTop) / span : 0;
            return rate > 0 ? last.measureEnd + (pixelY - last.pixelBottom) / rate : last.measureEnd;
        }

        // The true end of the song for stopping purposes. Playback
        // (metronome, chords, and scroll) all run until this point
        // regardless of when the visible content itself runs out.
        let songEndMeasure = 0;

        function scrollStep(timestamp) {
            if (!isScrolling) return;
            const sheetPane = document.getElementById('sheetPane');
            if (lastFrameTime !== null) {
                const dt = (timestamp - lastFrameTime) / 1000;
                // Recomputed fresh every frame from the live bpm variable, so a
                // tempo change mid-song immediately changes how fast measures
                // (and therefore scroll position) advance. Chord playback is
                // driven separately, from the metronome's own tick timing (see
                // metronomeTick), not from this loop.
                const beatsPerMeasure = getBeatsPerMeasure();
                const currentMeasureDuration = (60 / bpm) * beatsPerMeasure;
                songElapsedMeasures += dt / currentMeasureDuration;

                // scrollStartMeasure is purely a gate - scrolling doesn't
                // move until playback reaches it - not a coordinate offset;
                // currentMeasurePixelMap holds absolute song-measure
                // positions, so the target must be looked up by the
                // absolute songElapsedMeasures itself, not measures-past-
                // the-gate (subtracting here would look up the wrong
                // measure entirely once scrollStartMeasure is anything
                // other than ~0, e.g. after a mid-song resume).
                if (songElapsedMeasures >= scrollStartMeasure) {
                    const target = scrollTopForMeasure(songElapsedMeasures);
                    if (target !== null) sheetPane.scrollTop = Math.round(target - scrollJumpCorrection);
                }
            }
            lastFrameTime = timestamp;

            if (songElapsedMeasures >= songEndMeasure) {
                songFinished = true;
                stopScrolling();
                return;
            }
            requestAnimationFrame(scrollStep);
        }

        // Enough blank space below the sheet's actual content that scrolling
        // can continue moving (rather than clamp at the browser's natural
        // scrollHeight) until the whole song - including any tail past the
        // last visible line - has finished playing.
        function ensureScrollSpacer() {
            const sheetPane = document.getElementById('sheetPane');
            const spacer = document.getElementById('scrollSpacer');
            if (!spacer) return;
            spacer.style.height = '0px';
            const finalScrollTop = scrollTopForMeasure(songEndMeasure) || 0;
            const needed = (finalScrollTop + sheetPane.clientHeight) - sheetPane.scrollHeight;
            spacer.style.height = Math.max(0, needed) + 'px';
        }

        // Set only when scrolling stops because it reached the actual end
        // of the song (see scrollStep), not on a manual Stop - so the next
        // Scroll press knows to snap back to the top rather than treating
        // wherever the sheet ended up (the last line) as the reposition
        // point (see startScrolling's "second-to-last visible line" logic).
        let songFinished = false;

        // Only ever called for a fresh start from the very beginning of the
        // song (see beginCountInThenScroll) - a mid-song resume skips this
        // entirely and never touches scroll position (see startResumedPlayback).
        function startScrolling() {
            currentMeasurePixelMap = buildMeasurePixelMap();

            const sheetPane = document.getElementById('sheetPane');
            // Once scrolling is actively moving, the currently-playing line
            // stays pinned at a fixed distance from the top of the pane -
            // scrollStartMeasure IS that pinned distance, in measures (see
            // scrollStep's comment on why it's a gate, not an offset).
            // Anchoring it to a FIXED MEASURE COUNT (the old "30 measures
            // before the bottom of what's visible" rule) doesn't generalize:
            // how many measures fit in a given pixel height depends entirely
            // on how the sheet is currently rendered - ChordPlayer's tick/
            // measure-number grid fits far fewer measures per pixel than
            // Chordpro's plain annotation does (see computeTaggedTiming).
            // Anchoring to a FRACTION of the pane's own visible height
            // instead - about a third of the way down, a comfortable
            // teleprompter-style reading position with context above and
            // more to read below - adapts automatically to whatever's
            // actually on screen. measureForPixelY naturally accounts for
            // the title/header space too: it only knows about real chorded
            // lines (see buildMeasurePixelMap), so if the 1/3 mark falls
            // within/above the header it simply resolves to measure 0 - no
            // lead-in wait, scrolling starts moving immediately.
            const anchorPixelY = sheetPane.scrollTop + sheetPane.clientHeight / 3;
            scrollStartMeasure = Math.max(0, measureForPixelY(anchorPixelY));
            setScrollJumpCorrection(scrollStartMeasure);

            const lastLineMeasure = currentMeasurePixelMap.length
                ? currentMeasurePixelMap[currentMeasurePixelMap.length - 1].measureEnd
                : 0;
            const lastChordMeasure = chordSchedule.length
                ? chordSchedule[chordSchedule.length - 1].measurePosition
                : 0;
            songEndMeasure = Math.max(lastLineMeasure, lastChordMeasure);
            ensureScrollSpacer();

            isScrolling = true;
            lastFrameTime = null;
            setScrollButtonRunning(true);
            requestAnimationFrame(scrollStep);
        }

        function stopScrolling() {
            isScrolling = false;
            setScrollButtonRunning(false);
            stopMetronome();
            clearChordHighlight();
            stopAllChordAudio();
            updateResumeFlashDOM();
        }

        // Flat, measure-sorted list of every chord's (lineIdx, chordIdx)
        // address - the same addressing its rendered .chord-label span
        // carries as data attributes (see buildLyricAnchoredGridHTML /
        // buildEvenGridHTML) - so playback position can be looked up
        // against the DOM each frame.
        let chordHighlightList = [];
        let activeChordEl = null;

        function buildChordHighlightList() {
            const list = [];
            for (const lt of currentLineTimings) {
                lt.chordPositions.forEach((cp, chordIdx) => {
                    list.push({ lineIdx: lt.lineIdx, chordIdx, measurePosition: cp.measurePosition });
                });
            }
            list.sort((a, b) => a.measurePosition - b.measurePosition);
            return list;
        }

        // The chord sounding at or immediately before a given measure
        // position - shared by the playback highlight (elapsedMeasures) and
        // the paused "will resume here" flash (whatever measure the next
        // Scroll press would start from).
        function findChordAtOrBeforeMeasure(measure) {
            let match = null;
            for (const entry of chordHighlightList) {
                if (entry.measurePosition <= measure) match = entry;
                else break;
            }
            return match;
        }

        function findChordLabelEl(entry) {
            return entry
                ? document.querySelector(`#sheetPane .chord-label[data-line-idx="${entry.lineIdx}"][data-chord-idx="${entry.chordIdx}"]`)
                : null;
        }

        // Highlights whichever chord is currently sounding, based on the
        // same elapsed-measure clock that drives scrolling - only relevant
        // in ChordPlayer view, since Source never renders chord-label spans.
        function updateActiveChordHighlight(elapsedMeasures) {
            const el = findChordLabelEl(findChordAtOrBeforeMeasure(elapsedMeasures));
            if (el === activeChordEl) return;
            if (activeChordEl) activeChordEl.classList.remove('chord-active');
            activeChordEl = el;
            if (activeChordEl) activeChordEl.classList.add('chord-active');
        }

        function clearChordHighlight() {
            if (activeChordEl) activeChordEl.classList.remove('chord-active');
            activeChordEl = null;
        }

        // A chord the reader has right-clicked to designate as where the
        // *next* Scroll press should start from - overrides both defaults
        // (resume from wherever the sheet is scrolled, or snap to the top
        // once the song has played through) - see the sheetPane
        // 'contextmenu' handler and beginCountInThenScroll. Stored as an
        // address (not a measure position) so it stays valid across
        // duration edits that reflow later chords' positions; resolved
        // fresh each time it's read.
        let resumePointChord = null; // { lineIdx, chordIdx }

        function resolveResumePointMeasure() {
            if (!resumePointChord) return null;
            const lt = currentLineTimings[resumePointChord.lineIdx];
            const cp = lt && lt.chordPositions[resumePointChord.chordIdx];
            return cp ? cp.measurePosition : null;
        }

        // Where the *next* Scroll press will resume from: an explicit
        // right-click mark takes priority; otherwise it's wherever playback
        // actually last was (songElapsedMeasures - the last chord that was
        // really played, not a guess based on where the sheet happens to be
        // scrolled), or measure 0 once the song has played through to the
        // end (songFinished).
        function computePendingResumeMeasure() {
            if (resumePointChord) return resolveResumePointMeasure();
            if (tempoPauseState) return tempoPauseState.resumeMeasure;
            if (songFinished) return 0;
            return songElapsedMeasures;
        }

        // Chord that would sound at the point the *next* Scroll press
        // resumes from - flashed (see .resume-flash) whenever playback
        // isn't actively running, so a right-click mark or a manually
        // repositioned sheet always shows where it's about to pick up.
        let resumeFlashEl = null;

        function clearResumeFlash() {
            if (resumeFlashEl) resumeFlashEl.classList.remove('resume-flash', 'resume-highlight');
            resumeFlashEl = null;
        }

        function updateResumeFlashDOM() {
            clearResumeFlash();
            if (isScrolling || isCountingIn) return;
            if (!sourceLoaded || !currentSong || !document.getElementById('sourceViewTagged').checked) return;
            const measure = computePendingResumeMeasure();
            if (measure == null) return;
            chordHighlightList = buildChordHighlightList();
            const entry = findChordAtOrBeforeMeasure(measure);
            const el = findChordLabelEl(entry);
            if (el) {
                // Never flash the song's very first chord - only highlight
                // it solid - whether that's on initial load, after Top, or
                // once playback has finished back at measure 0.
                const isFirstChord = entry === chordHighlightList[0];
                el.classList.add(isFirstChord ? 'resume-highlight' : 'resume-flash');
                resumeFlashEl = el;
            }
        }

        // --- Metronome + count-in ---
        //
        // Runs continuously (visually always; audibly only if the Metronome
        // toggle is checked) from the moment Scroll is pressed through the end
        // of playback. A 1-measure count-in happens first - the metronome
        // ticks through one full measure at the current BPM/time signature;
        // chord playback begins the instant that ends (see scrollStartMeasure
        // for why scrolling itself waits longer).

        let metronomeInterval = null;
        let isCountingIn = false;
        let countInTimeout = null;

        // Chord playback is driven directly from the metronome's own tick
        // callback (the same setInterval clock that produces the audible
        // click), not from the RAF scroll loop - ties chords to the beat you
        // actually hear instead of two independently-drifting clocks.
        let metronomeTickCount = 0; // absolute tick count since Scroll was pressed
        let countInTicks = 0; // ticks that make up the count-in (1 measure)

        // Strum patterns: 8 eighth-note slots per 4/4 measure, "1 + 2 + 3 + 4 +".
        // 'D' = down strum (all fretted/open strings, low to high), 'U' = up
        // strum (highest 2-3 fretted/open strings, high to low), '-' = rest.
        // Only defined for 4/4 - see beatsPerMeasure guard in metronomeTick.
        // 'single' has no grid: it's today's original behavior (one strum on
        // chord change, one re-strum per measure while a chord sustains).
        const STRUM_PATTERNS = {
            single: { slots: null },
            quarter: { slots: ['D', '-', 'D', '-', 'D', '-', 'D', '-'] },
            alternate: { slots: ['D', 'U', 'D', 'U', 'D', 'U', 'D', 'U'] },
            basic: { slots: ['D', '-', 'D', 'U', 'D', 'U', 'D', '-'] },
            best: { slots: ['D', '-', 'D', 'U', '-', 'U', 'D', 'U'] },
        };

        // Up-strum audio scheduled via setTimeout for the "+" off-beats (see
        // metronomeTick) - must be cancelled on Stop, same as the metronome
        // interval itself, or an up-strum can fire audibly after playback has
        // already been stopped.
        let pendingStrumTimeouts = [];
        function clearPendingStrumTimeouts() {
            pendingStrumTimeouts.forEach(t => clearTimeout(t));
            pendingStrumTimeouts = [];
        }

        function getBeatsPerMeasure() {
            return parseInt(document.getElementById('timeSignatureSelect').value, 10);
        }

        // Synthesized tom hit: a sine oscillator with a quick downward pitch
        // sweep (the "boing" that makes a tom sound like a tom rather than a
        // flat beep) through a lowpass filter for warmth, plus a short filtered
        // noise burst for the stick-attack transient. Beat 1 gets a lower,
        // bigger, louder tom; beats 2-4 get a higher, smaller one - cuts through
        // a strummed guitar mix better than a low kick drum would.
        function getMetronomeVolume() {
            return parseInt(document.getElementById('metronomeVolumeSlider').value, 10) / 100;
        }

        function playMetronomeClick(isDownbeat) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            // exponentialRampToValueAtTime (below) throws if it ever has to
            // ramp from/to a literal 0, so floor at a value quiet enough to
            // read as silent instead of clamping to exactly 0.
            const volume = Math.max(getMetronomeVolume(), 0.0001);

            const basePitch = isDownbeat ? 60 : 100;
            const duration = isDownbeat ? 0.3 : 0.22;

            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(basePitch * 2.5, now);
            osc.frequency.exponentialRampToValueAtTime(basePitch, now + 0.06);

            const lowpass = ctx.createBiquadFilter();
            lowpass.type = 'lowpass';
            lowpass.frequency.value = isDownbeat ? 350 : 500;

            const gain = ctx.createGain();
            gain.gain.setValueAtTime((isDownbeat ? 0.5 : 0.4) * volume, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(lowpass);
            lowpass.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + duration + 0.02);

            // Short bandpass-filtered noise burst for the stick attack.
            const noiseDuration = 0.02;
            const bufferSize = Math.floor(ctx.sampleRate * noiseDuration);
            const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
            }
            const noiseSource = ctx.createBufferSource();
            noiseSource.buffer = noiseBuffer;
            const noiseFilter = ctx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.value = 1500;
            const noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.15 * volume, now);
            noiseSource.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(ctx.destination);
            noiseSource.start(now);
        }

        function updateBeatDisplay(activeBeat, beatsPerMeasure) {
            let html = '';
            for (let i = 1; i <= beatsPerMeasure; i++) {
                const classes = ['beat-num'];
                if (i === activeBeat) {
                    classes.push('beat-active');
                    if (i === 1) classes.push('beat-downbeat');
                }
                // data-beat identifies the "1" for the click-to-resync
                // handler below (see beatDisplay's click listener) -
                // needed since this markup is fully replaced every tick,
                // so nothing can be wired to a specific persistent element.
                const title = i === 1 ? ' title="Click on the downbeat to sync the standalone metronome to it"' : '';
                html += `<span class="${classes.join(' ')}" data-beat="${i}"${title}>${i}</span>`;
            }
            document.getElementById('beatDisplay').innerHTML = html;
        }

        function metronomeTick() {
            const beatsPerMeasure = getBeatsPerMeasure();
            const songBeatIndex = metronomeTickCount - countInTicks;
            metronomeTickCount++;

            // Signed modulo (not JS's remainder, which stays negative for a
            // negative songBeatIndex) so a count-in shorter than a full
            // measure - e.g. the 2-beat count-in on tempo-change resume -
            // still lands on beat 1 exactly when the count-in ends, by
            // counting backwards from it ("3, 4" leading into "1" in 4/4)
            // instead of restarting its own 1-based cycle from tick 0.
            const beatInMeasure = ((songBeatIndex % beatsPerMeasure) + beatsPerMeasure) % beatsPerMeasure + 1;
            updateBeatDisplay(beatInMeasure, beatsPerMeasure);
            if (metronomeOn) {
                playMetronomeClick(beatInMeasure === 1);
            }

            if (songBeatIndex >= 0) {
                // Same clock that decides when a chord's audio actually
                // fires (below) - the highlight is driven from this tick,
                // not the RAF scroll loop's own continuously-advancing
                // clock, so it can never drift out of sync with what's
                // actually sounding. Always runs during playback, regardless
                // of Metronome/Play Chords - those two only control what's
                // audible, not the visual highlight, which is useful on its
                // own (e.g. following along silently, or with the chord
                // audio muted).
                const elapsedMeasures = songClockBaseMeasure + songBeatIndex / beatsPerMeasure;
                // Re-sync the RAF scroll loop's own continuously-advancing
                // songElapsedMeasures to this tick's authoritative value on
                // every beat. The two clocks (setInterval here, RAF in
                // scrollStep) drift apart over a long playback run - and
                // since a Stop/resume computes where to pick up chord
                // playback from songElapsedMeasures (see
                // computePendingResumeMeasure), any accumulated drift there
                // meant resuming could recompute chordScheduleIndex a beat
                // or two behind where the metronome had actually already
                // played through, re-firing chords that had already
                // sounded - heard as the chord playing twice, out of time.
                songElapsedMeasures = elapsedMeasures;
                updateActiveChordHighlight(elapsedMeasures);
                const playChordsOn = document.getElementById('playChordsToggle').checked;
                if (playChordsOn) {
                    let struckThisTick = false;
                    let newChordThisTick = null;
                    while (chordScheduleIndex < chordSchedule.length && chordSchedule[chordScheduleIndex].measurePosition <= elapsedMeasures) {
                        if (window.CPL_DEBUG) console.log('[chord] scheduled', chordSchedule[chordScheduleIndex].chord, 'idx', chordScheduleIndex, 'at', elapsedMeasures.toFixed(4), 'entryPos', chordSchedule[chordScheduleIndex].measurePosition.toFixed(4));
                        newChordThisTick = chordSchedule[chordScheduleIndex].chord;
                        chordScheduleIndex++;
                        struckThisTick = true;
                    }

                    const strumPattern = STRUM_PATTERNS[document.getElementById('strumPatternSelect').value] || STRUM_PATTERNS.single;
                    const usePatternGrid = strumPattern.slots && beatsPerMeasure === 4;

                    if (!usePatternGrid) {
                        // Single Chord Strum (or a non-4/4 time signature,
                        // which the grid patterns aren't defined for): one
                        // strum on chord change, plus a once-per-measure
                        // re-strum of whatever chord is still sustaining. A
                        // chord's duration can carry it past a measure
                        // boundary with no new {x_cpl_m:} entry marking that
                        // measure - meaning it's still ringing into it, not
                        // silent - so re-strum whatever chord is currently
                        // held at the top of every measure that doesn't mark
                        // its own. Must be a REAL measure-boundary crossing
                        // (Math.floor(elapsedMeasures) changing since the
                        // previous tick), not beatInMeasure === 1 - that's
                        // counted from tick 0 of THIS resume, which only
                        // lines up with true boundaries when resuming from a
                        // whole measure. A mid-song resume from a fractional
                        // position (e.g. 5.375, stopped mid-measure) sends a
                        // false "beat 1" every 4 ticks at 5.375, 6.375,
                        // 7.375... - none of them real boundaries - each one
                        // spuriously re-striking the currently-held chord
                        // right after it had already sounded, heard as
                        // random doubled chords.
                        if (struckThisTick) {
                            // Chord-change strum - always accented.
                            playChordByName(newChordThisTick, 'down', true);
                        }
                        const crossedMeasureBoundary = songBeatIndex === 0 ||
                            Math.floor(elapsedMeasures) !== Math.floor(elapsedMeasures - 1 / beatsPerMeasure);
                        if (crossedMeasureBoundary && !struckThisTick && chordScheduleIndex > 0) {
                            if (window.CPL_DEBUG) console.log('[chord] SUSTAIN re-strum', chordSchedule[chordScheduleIndex - 1].chord, 'idx', chordScheduleIndex - 1, 'at', elapsedMeasures.toFixed(4));
                            // Falls on the downbeat of a new measure - accented.
                            playChordByName(chordSchedule[chordScheduleIndex - 1].chord, 'down', true);
                        }
                    } else {
                        // Grid-driven strum pattern: chord onsets always land
                        // on a quarter-beat slot (chord durations snap to
                        // quarter-measure ticks), so this tick's own onset
                        // and the pattern grid share the same quarter-beat
                        // clock - no extra timing engine needed for the
                        // down-strum ('D') slots. Up-strums ('U') land on
                        // the "+" eighth-note between this beat and the
                        // next, scheduled via setTimeout at half a beat from
                        // now (cleared on Stop - see clearPendingStrumTimeouts).
                        const heldChord = struckThisTick
                            ? newChordThisTick
                            : (chordScheduleIndex > 0 ? chordSchedule[chordScheduleIndex - 1].chord : null);
                        if (heldChord !== null) {
                            const quarterSlot = strumPattern.slots[2 * (beatInMeasure - 1)];
                            const offBeatSlot = strumPattern.slots[2 * (beatInMeasure - 1) + 1];
                            // A chord change is always audible, even if this
                            // pattern rests on this beat (e.g. Best Strum
                            // rests on beat 3) - a new chord should never
                            // start silently.
                            if (struckThisTick || quarterSlot === 'D') {
                                // Accented on a chord change or the downbeat
                                // of the measure - everything else in the
                                // pattern strums lighter.
                                const isAccent = struckThisTick || beatInMeasure === 1;
                                if (window.CPL_DEBUG) console.log('[chord] STRUM down', heldChord, 'beat', beatInMeasure, 'accent', isAccent, 'at', elapsedMeasures.toFixed(4));
                                playChordByName(heldChord, 'down', isAccent);
                            }
                            if (offBeatSlot === 'U') {
                                const halfBeatMs = (60 / bpm / 2) * 1000;
                                if (window.CPL_DEBUG) console.log('[chord] STRUM up (scheduled)', heldChord, 'beat', beatInMeasure, 'at', elapsedMeasures.toFixed(4));
                                const t = setTimeout(() => playChordByName(heldChord, 'up'), halfBeatMs);
                                pendingStrumTimeouts.push(t);
                            }
                        }
                    }
                }
            }
        }

        function startMetronome() {
            metronomeTickCount = 0;
            metronomeTick();
            metronomeInterval = setInterval(metronomeTick, (60 / bpm) * 1000);
        }

        // setInterval locks in its delay at creation time, so if BPM changes
        // while the metronome is already running, the tick rate would otherwise
        // stay stuck at the old tempo even though scroll speed updates live.
        // Reschedule the interval (keeping the current beat position) whenever
        // BPM changes mid-run.
        function resyncMetronomeToBPM() {
            if (!metronomeInterval) return;
            clearInterval(metronomeInterval);
            metronomeInterval = setInterval(metronomeTick, (60 / bpm) * 1000);
        }

        function stopMetronome() {
            isCountingIn = false;
            if (countInTimeout) {
                clearTimeout(countInTimeout);
                countInTimeout = null;
            }
            if (metronomeInterval) {
                clearInterval(metronomeInterval);
                metronomeInterval = null;
            }
            clearPendingStrumTimeouts();
            updateBeatDisplay(0, getBeatsPerMeasure());
        }

        // #metronomePlayBtn is the only metronome control - metronomeOn is
        // its single on/off state, read live by metronomeTick above. While
        // the chordplayer sheet is actually playing (isScrolling/
        // isCountingIn/tempoPauseState), turning it on just makes that same
        // synced tick start clicking - there's something to lock to, so no
        // separate clock is started. Otherwise (nothing playing - includes
        // just reading the Chordpro/Raw text with nothing to sync to) it
        // falls back to this standalone, free-running click-track instead:
        // no scrolling, no chord scheduling/highlight, no
        // songElapsedMeasures, just an audible/visual beat at the current
        // BPM to get the tempo in your ear before playing.
        let metronomeOn = false;
        let standaloneMetronomeInterval = null;
        let standaloneBeatCount = 0;

        function standaloneMetronomeTick() {
            const beatsPerMeasure = getBeatsPerMeasure();
            const beatInMeasure = (standaloneBeatCount % beatsPerMeasure) + 1;
            standaloneBeatCount++;
            updateBeatDisplay(beatInMeasure, beatsPerMeasure);
            playMetronomeClick(beatInMeasure === 1);
        }

        function startStandaloneMetronome() {
            // Same viewport reposition Scroll does on press (see
            // beginCountInThenScroll) - brings the settings bar/player
            // controls into view the same way, for consistency.
            document.querySelector('.chordplayer-bar').scrollIntoView({ behavior: 'auto', block: 'start' });
            standaloneBeatCount = 0;
            standaloneMetronomeTick();
            standaloneMetronomeInterval = setInterval(standaloneMetronomeTick, (60 / bpm) * 1000);
            setMetronomeButtonOn(true);
        }

        function setMetronomeButtonOn(on) {
            const btn = document.getElementById('metronomePlayBtn');
            btn.innerHTML = on ? '&#9724;' : '&#9654;';
            btn.classList.toggle('player-btn-stop', on);
        }

        // Single entry point for turning the metronome on/off from either
        // control - #metronomePlayBtn (row 1) or #metronomeAutoStartToggle
        // (row 2) - keeping both in sync with each other and with
        // metronomeOn itself. While the chordplayer sheet is actually
        // playing, metronomeTick already reads metronomeOn live every
        // tick, so there's no separate clock to start/stop here - just the
        // controls' own look. Otherwise, falls back to the standalone
        // free-running click (or stops it).
        function setMetronomeOn(on) {
            metronomeOn = on;
            setMetronomeButtonOn(on);
            const checkbox = document.getElementById('metronomeAutoStartToggle');
            if (checkbox) checkbox.checked = on;
            const playbackActive = isScrolling || isCountingIn || !!tempoPauseState;
            if (playbackActive) return;
            if (on) {
                if (!standaloneMetronomeInterval) startStandaloneMetronome();
            } else if (standaloneMetronomeInterval) {
                stopStandaloneMetronome();
            }
        }

        // Same "reschedule the interval, keep the beat position" pattern as
        // resyncMetronomeToBPM above, for the standalone metronome's own
        // independent interval.
        function resyncStandaloneMetronomeToBPM() {
            if (!standaloneMetronomeInterval) return;
            clearInterval(standaloneMetronomeInterval);
            standaloneMetronomeInterval = setInterval(standaloneMetronomeTick, (60 / bpm) * 1000);
        }

        function stopStandaloneMetronome() {
            if (standaloneMetronomeInterval) {
                clearInterval(standaloneMetronomeInterval);
                standaloneMetronomeInterval = null;
                updateBeatDisplay(0, getBeatsPerMeasure());
            }
            setMetronomeButtonOn(false);
        }

        // Click-to-resync: while the standalone metronome is running,
        // clicking the "1" (see updateBeatDisplay's data-beat/title) marks
        // that exact click as the true downbeat - the tick fires
        // immediately (so the click itself sounds/flashes as beat 1) and
        // the interval restarts from that instant, at the current tempo.
        // Scoped to the standalone metronome only, not live Scroll
        // playback - realigning beat phase mid-song would also have to
        // rework the continuous elapsed-measure math chord scheduling
        // depends on, a much bigger and riskier change.
        function resyncStandaloneMetronomeToNow() {
            if (!standaloneMetronomeInterval) return;
            clearInterval(standaloneMetronomeInterval);
            standaloneBeatCount = 0;
            standaloneMetronomeTick();
            standaloneMetronomeInterval = setInterval(standaloneMetronomeTick, (60 / bpm) * 1000);
        }

        // Runs the metronome for `ticks` beats (visually always; audibly
        // only if the Metronome toggle is checked), then calls
        // onCountInEnd - shared by a fresh start (1 full measure), a
        // mid-song resume (2 beats - see beginCountInThenScroll), and a
        // tempo-change resume (also 2 beats - see resumeAfterTempoChange).
        function startCountIn(ticks, onCountInEnd) {
            isCountingIn = true;
            setScrollButtonRunning(true);
            countInTicks = ticks;
            startMetronome();

            const countInDuration = (60 / bpm) * ticks * 1000;
            countInTimeout = setTimeout(() => {
                isCountingIn = false;
                countInTimeout = null;
                onCountInEnd();
            }, countInDuration);
        }

        // Resumes scrolling immediately, with no lead-in wait and no
        // change to scroll position - used whenever playback is picking up
        // mid-song (a marked chord, wherever it last stopped, or after a
        // tempo-change pause) rather than starting fresh from the top.
        function resumePlaybackImmediately() {
            isScrolling = true;
            lastFrameTime = null;
            requestAnimationFrame(scrollStep); // metronome interval keeps running through playback
        }

        function beginCountInThenScroll() {
            // #metronomeAutoStartToggle checked - Scroll starting also
            // turns the metronome on (if it isn't already), audible from
            // the very first count-in tick via startMetronome/metronomeTick
            // below - not through startStandaloneMetronome, which would
            // start a second, independent clock alongside the one about to
            // begin.
            if (document.getElementById('metronomeAutoStartToggle').checked) {
                metronomeOn = true;
                setMetronomeButtonOn(true);
            }
            const sheetPane = document.getElementById('sheetPane');
            document.querySelector('.chordplayer-bar').scrollIntoView({ behavior: 'auto', block: 'start' });
            clearResumeFlash();
            // Belt-and-suspenders alongside haltPlayback's own cutoff: a
            // chord struck right before Stop can still be ringing (each
            // note lasts up to a few seconds - see getNoteDuration()),
            // and letting it bleed into freshly resumed playback sounds
            // like the chord playing twice, out of time with itself.
            stopAllChordAudio();

            // Only a plain "wherever it stopped" resume needs snapping to a
            // clean chord/measure boundary (see snappedResumeMeasure below)
            // - an explicit right-click mark, a tempo-drag pause resume, or
            // restarting after the song finished are all already exact,
            // intentional positions and must be used as-is. Captured before
            // computePendingResumeMeasure() consumes resumePointChord below.
            const isPlainContinuation = !resumePointChord && !tempoPauseState && !songFinished;
            const resumeMeasure = computePendingResumeMeasure();
            resumePointChord = null; // consume any explicit mark either way

            // Chord schedule is set up now, before the metronome starts
            // ticking, so it's ready the instant the count-in ends (the
            // metronome's own tick callback triggers chords and the
            // highlight - see metronomeTick).
            // playChordsToggle is only ever enabled/checked while "With Time
            // Tags" is selected (see syncPaneDisplay), so this is always the
            // tagged schedule already.
            chordSchedule = document.getElementById('playChordsToggle').checked ? currentChordScheduleFull : [];

            if (resumeMeasure > 0) {
                // Resuming mid-song - a right-click mark, or wherever
                // playback actually last stopped - normally never
                // repositions the sheet; once the count-in ends, scrolling
                // just continues moving from wherever it's already
                // scrolled. A short 2-beat count-in (beats "3, 4" counting
                // into the downbeat - see metronomeTick's signed modulo)
                // instead of a full measure, and no lead-in wait, since the
                // reader is already looking at roughly the right spot.
                songFinished = false;
                chordScheduleIndex = chordSchedule.findIndex(c => c.measurePosition >= resumeMeasure);
                if (chordScheduleIndex === -1) chordScheduleIndex = chordSchedule.length;

                // For a plain "wherever it stopped" resume, snap back to the
                // true start of whichever chord was actually sounding (or
                // the nearest whole measure, if Play Chords is off and
                // there's no chord to anchor to) instead of resuming from
                // the exact - possibly mid-strum - measure position it
                // stopped at. Two reasons: the first strum after resuming is
                // then a clean full-length onset of that chord rather than
                // picking it up already in progress/clipped, and every later
                // measure-boundary check (metronomeTick's re-strum) lines up
                // with the real chord grid instead of the arbitrary
                // fractional offset the song happened to stop at. An
                // explicit right-click mark/tempo-pause/restart resume is
                // already an exact, intentional position - chordScheduleIndex
                // lands ON that chord rather than past it, so snapping to
                // chordScheduleIndex - 1 there would snap to the WRONG
                // (previous) chord instead - leave those untouched.
                const heldChord = (isPlainContinuation && chordScheduleIndex > 0) ? chordSchedule[chordScheduleIndex - 1] : null;
                const snappedResumeMeasure = heldChord ? heldChord.measurePosition
                    : isPlainContinuation ? Math.floor(resumeMeasure)
                    : resumeMeasure;

                songElapsedMeasures = snappedResumeMeasure;
                songClockBaseMeasure = snappedResumeMeasure;
                scrollStartMeasure = snappedResumeMeasure;
                if (window.CPL_DEBUG) console.log('[resume]', 'resumeMeasure', resumeMeasure.toFixed(4), 'snappedTo', snappedResumeMeasure.toFixed(4), 'chordScheduleIndex', chordScheduleIndex, 'prevEntry', chordSchedule[chordScheduleIndex - 1], 'nextEntry', chordSchedule[chordScheduleIndex]);
                chordHighlightList = buildChordHighlightList();

                currentMeasurePixelMap = buildMeasurePixelMap();

                // The one exception to "never repositions the sheet": if the
                // reader has manually scrolled the resume chord itself off
                // screen since stopping, resuming without moving the pane
                // would start the count-in against a chord they can't even
                // see. Snap it back into view - centered vertically in the
                // pane - before the count-in begins; otherwise leave the
                // pane exactly where it is.
                const resumeTarget = scrollTopForMeasure(snappedResumeMeasure);
                const isResumeChordVisible = resumeTarget !== null &&
                    resumeTarget >= sheetPane.scrollTop &&
                    resumeTarget <= sheetPane.scrollTop + sheetPane.clientHeight;
                if (!isResumeChordVisible && resumeTarget !== null) {
                    sheetPane.scrollTop = Math.max(0, Math.round(resumeTarget - sheetPane.clientHeight / 2));
                }

                setScrollJumpCorrection(scrollStartMeasure);
                const lastLineMeasure = currentMeasurePixelMap.length
                    ? currentMeasurePixelMap[currentMeasurePixelMap.length - 1].measureEnd
                    : 0;
                const lastChordMeasure = chordSchedule.length
                    ? chordSchedule[chordSchedule.length - 1].measurePosition
                    : 0;
                songEndMeasure = Math.max(lastLineMeasure, lastChordMeasure);
                ensureScrollSpacer();

                startCountIn(2, resumePlaybackImmediately);
            } else {
                // A fresh start from the very beginning of the song (also
                // reached once the song has played through - songFinished
                // resets resumeMeasure to 0 above) - full 1-measure
                // count-in, and startScrolling's usual lead-in wait/gate.
                if (songFinished) {
                    sheetPane.scrollTop = 0;
                    songFinished = false;
                }
                songElapsedMeasures = 0;
                songClockBaseMeasure = 0;
                chordScheduleIndex = 0;
                chordHighlightList = buildChordHighlightList();

                startCountIn(getBeatsPerMeasure(), startScrolling);
            }
        }

        // Fully halts playback (Stop, or the Top button interrupting a run
        // in progress) - as opposed to pauseForTempoChange, which only
        // suspends it mid-drag expecting a resume.
        function haltPlayback() {
            if (window.CPL_DEBUG) console.log('[stop]', 'songElapsedMeasures', songElapsedMeasures.toFixed(4), 'chordScheduleIndex', chordScheduleIndex, 'scrollTop', document.getElementById('sheetPane').scrollTop);
            isScrolling = false;
            tempoPauseState = null;
            tempoDragActive = false;
            stopMetronome();
            clearChordHighlight();
            stopAllChordAudio();
            setScrollButtonRunning(false);
            updateResumeFlashDOM();
            // Scroll stopping also stops the metronome if it was on and
            // synced to that playback - it doesn't fall back to a
            // free-running click on its own; starting it again (standalone,
            // or synced to the next Scroll) is a separate action.
            if (metronomeOn) setMetronomeOn(false);
        }

        document.getElementById('scrollToggleBtn').addEventListener('click', () => {
            // Pressing Scroll always wins over the standalone metronome's
            // own free-running click - stop just that interval (leaving
            // the button's on/off look as-is, driven by metronomeOn) so
            // playback starts clean; if metronomeOn is true, metronomeTick
            // picks up the click immediately, synced to its own count-in,
            // instead of two clocks ticking at once.
            if (standaloneMetronomeInterval) {
                clearInterval(standaloneMetronomeInterval);
                standaloneMetronomeInterval = null;
            }
            if (isScrolling || isCountingIn || tempoPauseState) {
                haltPlayback();
            } else {
                beginCountInThenScroll();
            }
        });

        document.getElementById('metronomePlayBtn').addEventListener('click', () => {
            setMetronomeOn(!metronomeOn);
        });

        // #metronomeAutoStartToggle doubles as: (1) whether Scroll starting
        // fresh also turns the metronome on (read directly in
        // beginCountInThenScroll below), and (2) - like #metronomePlayBtn -
        // a live on/off switch of its own, e.g. to start the metronome
        // mid-Scroll without reaching for the row-1 button.
        document.getElementById('metronomeAutoStartToggle').addEventListener('change', (e) => {
            setMetronomeOn(e.target.checked);
        });

        // Delegated (not bound to the "1" span directly) since
        // updateBeatDisplay replaces the whole beatDisplay markup every tick.
        document.getElementById('beatDisplay').addEventListener('click', (e) => {
            const target = e.target.closest('.beat-num');
            if (target && target.dataset.beat === '1') resyncStandaloneMetronomeToNow();
        });

        // Clicking a chord to edit its duration (or just manually scrolling
        // around) repositions where the next Scroll press picks up from
        // (see startScrolling) - this is an explicit way back to measure 0
        // of the song without having to scroll the sheet there by hand.
        document.getElementById('topBtn').addEventListener('click', () => {
            haltPlayback();
            document.querySelector('.chordplayer-bar').scrollIntoView({ behavior: 'auto', block: 'start' });
            document.getElementById('sheetPane').scrollTop = 0;
            songElapsedMeasures = 0;
            scrollStartMeasure = 0;
            songFinished = false;
            resumePointChord = null;
            updateResumeFlashDOM();
        });

        // Dragging the tempo slider mid-playback doesn't rescale the running
        // clock live - it pauses scrolling/metronome/chords/highlight for the
        // duration of the drag (see pauseForTempoChange), then on release
        // re-counts-in for 2 beats at the new tempo and resumes from the
        // start of whatever measure was playing when the drag began (see
        // resumeAfterTempoChange).
        let tempoPauseState = null; // { resumeMeasure } while paused for a drag
        let tempoDragActive = false;

        function pauseForTempoChange() {
            if (countInTimeout) {
                clearTimeout(countInTimeout);
                countInTimeout = null;
            }
            if (metronomeInterval) {
                clearInterval(metronomeInterval);
                metronomeInterval = null;
            }
            isScrolling = false;
            isCountingIn = false;
            lastFrameTime = null;
            tempoPauseState = { resumeMeasure: Math.floor(songElapsedMeasures) };
            clearChordHighlight();
            updateResumeFlashDOM();
        }

        function resumeAfterTempoChange() {
            if (!tempoPauseState) return;
            clearResumeFlash();
            const resumeMeasure = tempoPauseState.resumeMeasure;
            tempoPauseState = null;
            songElapsedMeasures = resumeMeasure;
            songClockBaseMeasure = resumeMeasure;
            chordScheduleIndex = chordSchedule.findIndex(c => c.measurePosition >= resumeMeasure);
            if (chordScheduleIndex === -1) chordScheduleIndex = chordSchedule.length;

            startCountIn(2, resumePlaybackImmediately);
        }

        document.getElementById('bpmSlider').addEventListener('input', (e) => {
            bpm = parseInt(e.target.value, 10);
            updateBpmLabel();
            if (isScrolling || isCountingIn) {
                tempoDragActive = true;
                pauseForTempoChange();
            } else {
                resyncMetronomeToBPM();
            }
            resyncStandaloneMetronomeToBPM();
        });

        document.getElementById('bpmSlider').addEventListener('change', () => {
            if (tempoDragActive) {
                tempoDragActive = false;
                resumeAfterTempoChange();
            }
        });

        document.getElementById('youtubeUrlInput').addEventListener('change', updateVideoEmbed);

        document.getElementById('videoSpeedSelect').addEventListener('change', (e) => {
            if (ytPlayer) ytPlayer.setPlaybackRate(parseFloat(e.target.value));
        });

        document.getElementById('videoVolumeSlider').addEventListener('input', (e) => {
            if (ytPlayer) ytPlayer.setVolume(parseInt(e.target.value, 10));
        });

        // Live-update the time label while dragging (videoPositionDragging
        // suppresses the polling loop in startVideoPositionPolling so it
        // doesn't fight the drag), then actually seek only once released -
        // seeking on every 'input' tick would spam the player with
        // requests and make dragging feel laggy/stuttery.
        document.getElementById('videoPositionSlider').addEventListener('input', (e) => {
            videoPositionDragging = true;
            document.getElementById('videoPositionLabel').textContent = formatVideoTime(parseInt(e.target.value, 10));
        });
        document.getElementById('videoPositionSlider').addEventListener('change', (e) => {
            if (ytPlayer) ytPlayer.seekTo(parseInt(e.target.value, 10), true);
            videoPositionDragging = false;
        });

        // Tap-tempo: click #tapTempoBtn in rhythm with the reference video
        // to set the BPM slider by ear, rather than dragging it. Averages
        // the last several taps (a single interval would be too noisy) - a
        // gap longer than TAP_TIMEOUT_MS since the last tap starts a fresh
        // rhythm instead of blending into a stale one.
        let tapTimestamps = [];
        const TAP_TIMEOUT_MS = 2000;
        const TAP_MAX_SAMPLES = 8;

        document.getElementById('tapTempoBtn').addEventListener('click', () => {
            const now = performance.now();
            if (tapTimestamps.length && now - tapTimestamps[tapTimestamps.length - 1] > TAP_TIMEOUT_MS) {
                tapTimestamps = [];
            }
            tapTimestamps.push(now);
            if (tapTimestamps.length > TAP_MAX_SAMPLES) tapTimestamps.shift();
            if (tapTimestamps.length < 2) return;

            const intervals = [];
            for (let i = 1; i < tapTimestamps.length; i++) intervals.push(tapTimestamps[i] - tapTimestamps[i - 1]);
            const avgMs = intervals.reduce((a, b) => a + b, 0) / intervals.length;

            const slider = document.getElementById('bpmSlider');
            const min = parseInt(slider.min, 10);
            const max = parseInt(slider.max, 10);
            bpm = Math.min(max, Math.max(min, Math.round(60000 / avgMs)));
            slider.value = bpm;
            updateBpmLabel();
            resyncMetronomeToBPM();
            resyncStandaloneMetronomeToBPM();
        });

        document.getElementById('timeSignatureSelect').addEventListener('change', () => {
            if (!isScrolling && !isCountingIn) updateBeatDisplay(0, getBeatsPerMeasure());
        });

        updateBeatDisplay(0, getBeatsPerMeasure());

        // Restores Play Chords to whatever it was last set to while in
        // ChordPlayer+Sheet mode - called only from the mode-switching
        // listeners below (not from syncPaneDisplay, which runs on every
        // render and would otherwise clobber a live in-mode toggle).
        function restorePlayChordsForMode() {
            const showTagged = document.getElementById('sourceViewTagged').checked;
            const showSheet = document.getElementById('viewModeSheet').checked;
            if (showTagged && showSheet) {
                document.getElementById('playChordsToggle').checked = lastPlayChordsInSheetMode;
            }
        }

        document.getElementById('sourceViewSource').addEventListener('change', () => {
            renderActive();
            restorePlayChordsForMode();
        });
        document.getElementById('sourceViewTagged').addEventListener('change', () => {
            renderActive();
            restorePlayChordsForMode();
        });

        // Choosing Sheet or Raw is the trigger to convert the pasted text
        // into a song, the first time either is chosen with nothing loaded
        // yet - whichever one you clicked is respected as-is (unlike a
        // file/drop load, which always resets to the Sheet+Chordplayer
        // defaults - see loadNewSource), so picking Raw first lands you in
        // Raw, not bounced back to Sheet.
        function handleViewModeChange() {
            if (!sourceLoaded) {
                if (ingestSource(document.getElementById('rawPane').value)) finishLoad();
                return;
            }
            renderActive();
            restorePlayChordsForMode();
        }
        document.getElementById('viewModeRaw').addEventListener('change', handleViewModeChange);
        document.getElementById('viewModeSheet').addEventListener('change', handleViewModeChange);
        document.getElementById('playChordsToggle').addEventListener('change', () => {
            const showTagged = document.getElementById('sourceViewTagged').checked;
            const showSheet = document.getElementById('viewModeSheet').checked;
            if (showTagged && showSheet) {
                lastPlayChordsInSheetMode = document.getElementById('playChordsToggle').checked;
            }

            // Take effect immediately if playback is already running,
            // rather than only on the next Scroll press - re-derive the
            // live chord schedule from the current playback position
            // (same lookup beginCountInThenScroll uses for a mid-song
            // resume), so checking it back on picks up the schedule from
            // here rather than replaying everything already passed.
            if (isScrolling || isCountingIn) {
                chordSchedule = document.getElementById('playChordsToggle').checked ? currentChordScheduleFull : [];
                chordScheduleIndex = chordSchedule.findIndex(c => c.measurePosition >= songElapsedMeasures);
                if (chordScheduleIndex === -1) chordScheduleIndex = chordSchedule.length;
            }
        });
        document.getElementById('printDiagramsCheck').addEventListener('change', renderActive);
        document.getElementById('printColorColor').addEventListener('change', renderActive);
        document.getElementById('printColorBw').addEventListener('change', renderActive);
        document.getElementById('transposeMinusBtn').addEventListener('click', () => transposeSong(-1));
        document.getElementById('transposePlusBtn').addEventListener('click', () => transposeSong(1));

        document.getElementById('chordDurationSelect').addEventListener('change', regenerateTaggedFromSource);
        document.getElementById('simplifyToggle').addEventListener('change', renderActive);
        document.getElementById('legendShowNotes').addEventListener('change', renderLegend);
        document.getElementById('legendShowIntervals').addEventListener('change', renderLegend);

        // Typing is only possible while "With Time Tags" is selected
        // (Source is read-only once loaded - see syncPaneDisplay); sync
        // keystrokes into the in-memory tagged buffer as they happen, but
        // only re-render the sheet on blur so the sheet doesn't jump around
        // mid-edit.
        const rawPaneEl = document.getElementById('rawPane');
        rawPaneEl.addEventListener('input', () => {
            if (!sourceLoaded || rawPaneEl.readOnly) return;
            chordPlayerText = rawPaneEl.value;
            tagsDirty = true;
        });
        rawPaneEl.addEventListener('blur', () => {
            if (!sourceLoaded || document.getElementById('sourceViewSource').checked) return;
            renderActive();
        });

        // --- Click-to-adjust chord duration ---
        //
        // Clicking a chord's own label in the sheet (only while viewing
        // "ChordPlayer" - see syncPaneDisplay's tags-editable class) pops up a
        // -/+ stepper for that one chord's {x_cpl_m:D} duration, in 0.25-
        // measure steps, floored at 0. If the chord has no explicit tag
        // yet, the first click starts from whatever it's currently using
        // (the "Auto chord duration" setting) rather than an arbitrary
        // default, so the very first click doesn't jump its timing.
        const CHORD_DURATION_STEP = 0.25;
        let durationPopupState = null; // { lineIdx, chordIdx }

        function collectSongLines(song) {
            const lines = [];
            for (const section of song.sections) {
                for (const line of section.lines) {
                    if (line.type === 'line') lines.push(line);
                }
            }
            return lines;
        }

        // Re-parses the tagged buffer (the only mutable copy) and locates
        // one specific line by lineIdx - the same addressing the rendered
        // chord-label spans carry as a data attribute. Returns null if the
        // buffer has since changed shape out from under that address (e.g.
        // stale popup after a reload).
        function findTaggedChordLine(lineIdx) {
            const song = parseChordPro(chordPlayerText);
            const line = collectSongLines(song)[lineIdx];
            if (!line) return null;
            return { song, line };
        }

        // Same, but also locates one specific chord instance by chordIdx
        // within that line (its position in index-sorted order, matching
        // the chord-label's data-chord-idx).
        function findTaggedChord(lineIdx, chordIdx) {
            const found = findTaggedChordLine(lineIdx);
            if (!found) return null;
            const chords = [...found.line.chords].sort((a, b) => a.index - b.index);
            const chord = chords[chordIdx];
            if (!chord) return null;
            return { song: found.song, line: found.line, chord };
        }

        // Re-serializes an edited parse back into the tagged buffer and
        // re-renders - shared by both duration and chord-name edits.
        function commitTaggedSong(song) {
            const chordDurationMeasures = parseFloat(document.getElementById('chordDurationSelect').value);
            const timing = computeMeasureTiming(song, chordDurationMeasures);
            chordPlayerText = buildTaggedChordPro(song, timing);
            tagsDirty = true;
            renderActive();
        }

        // --- Section wrapping (Ctrl+Alt+V/C/B/T) ---
        //
        // Lets the user select a range of lines in the rendered sheet (with
        // "ChordPlayer" tags editable) and wrap them in a new
        // {sov:}/{eov:}, {soc:}/{eoc:}, {sob:}/{eob:}, or {sot:}/{eot:}
        // section - purely structural, doesn't touch any chord/lyric data.
        // Verse/chorus/bridge/tab are all symmetric here: none of them
        // change how a wrapped line's chords get parsed (see
        // parseChordPro's per-line, not per-block, tab handling), only
        // which group/rendering-style it's filed under.
        //
        // Scope limit: only works when the whole selected range sits
        // inside ONE existing section (splitting it into up to three:
        // before/wrapped/after) - a selection straddling two already-
        // distinct sections is refused rather than guessing at a merge.
        const SECTION_WRAP_DEFAULT_LABEL = { chorus: 'Chorus', verse: 'Verse', bridge: 'Bridge', tab: null };

        // Maps the browser's current text selection (if any) inside the
        // sheet-pane to a [start, end] lineIdx range - the same numbering
        // data-line-idx/collectSongLines use - by rounding out to every
        // FULL logical line the selection touches (a wrapped/print-wrapped
        // line may render as several .sheet-line elements sharing one
        // data-line-idx - Math.min/max over duplicates is still correct).
        function getSelectedLineIdxRange() {
            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
            const range = sel.getRangeAt(0);
            const touched = [...document.querySelectorAll('#sheetPane .sheet-line[data-line-idx]')]
                .filter((el) => range.intersectsNode(el))
                .map((el) => parseInt(el.dataset.lineIdx, 10));
            if (!touched.length) return null;
            return { start: Math.min(...touched), end: Math.max(...touched) };
        }

        // Splits whichever existing section contains the full
        // [startLineIdx, endLineIdx] range into up to three sections -
        // unchanged content before it, a new section of `sectionType`
        // wrapping exactly the selected lines (and anything - blanks,
        // comments - sitting between them), and unchanged content after.
        // Mutates song.sections in place. Returns { ok: true } or
        // { ok: false, reason: 'straddle' | 'not-found' }.
        function wrapLinesInSection(song, startLineIdx, endLineIdx, sectionType) {
            let idx = 0;
            for (let i = 0; i < song.sections.length; i++) {
                const section = song.sections[i];
                const lines = section.lines;
                let startArrIdx = -1;
                let endArrIdx = -1;
                for (let j = 0; j < lines.length; j++) {
                    if (lines[j].type !== 'line') continue;
                    if (idx === startLineIdx) startArrIdx = j;
                    if (idx === endLineIdx) endArrIdx = j + 1;
                    idx++;
                }
                const containsStart = startArrIdx !== -1;
                const containsEnd = endArrIdx !== -1;
                if (containsStart !== containsEnd) return { ok: false, reason: 'straddle' };
                if (!containsStart) continue;

                const before = lines.slice(0, startArrIdx);
                const wrapped = lines.slice(startArrIdx, endArrIdx);
                const after = lines.slice(endArrIdx);

                const newSections = [];
                if (before.length) newSections.push({ ...section, lines: before });
                newSections.push({ type: sectionType, label: SECTION_WRAP_DEFAULT_LABEL[sectionType], lines: wrapped });
                if (after.length) newSections.push({ type: 'verse', label: null, lines: after });

                song.sections.splice(i, 1, ...newSections);
                return { ok: true };
            }
            return { ok: false, reason: 'not-found' };
        }

        // Finds the raw source-text line number (0-based, matching
        // text.split(/\r?\n/)) of the lineIdx'th chorded/lyric line in
        // `song` - see parseChordPro's `_rawLine` bookkeeping.
        function findRawLineForLineIdx(song, targetLineIdx) {
            let idx = 0;
            for (const section of song.sections) {
                for (const line of section.lines) {
                    if (line.type !== 'line') continue;
                    if (idx === targetLineIdx) return line._rawLine;
                    idx++;
                }
            }
            return -1;
        }

        // Inserts `startTag`/`endTag` as new whole lines immediately before/
        // after the given lineIdx range, directly in `text` - used for
        // chordProText, which (unlike chordPlayerText) has no {x_cpl_m:}
        // timing tags of its own and so can't go through the parse ->
        // mutate -> buildTaggedChordPro round trip without picking some up.
        // A plain text insertion has no such side effect.
        function insertSectionTagsInText(text, startLineIdx, endLineIdx, startTag, endTag) {
            const song = parseChordPro(text);
            const startRaw = findRawLineForLineIdx(song, startLineIdx);
            const endRaw = findRawLineForLineIdx(song, endLineIdx);
            if (startRaw < 0 || endRaw < 0) return text;
            const lines = text.split(/\r?\n/);
            lines.splice(endRaw + 1, 0, endTag);
            lines.splice(startRaw, 0, startTag);
            return lines.join('\n');
        }

        const SECTION_WRAP_TAGS = {
            verse: ['{sov:}', '{eov:}'],
            chorus: ['{soc:}', '{eoc:}'],
            bridge: ['{sob:}', '{eob:}'],
            tab: ['{sot:}', '{eot:}'],
        };

        function wrapSelectionInSection(sectionType) {
            if (!sourceLoaded) return;
            if (!document.getElementById('sourceViewTagged').checked || !document.getElementById('viewModeSheet').checked) return;

            const range = getSelectedLineIdxRange();
            if (!range) {
                alert('Select one or more full lines in the sheet first, then use this shortcut.');
                return;
            }

            const song = parseChordPro(chordPlayerText);
            const result = wrapLinesInSection(song, range.start, range.end, sectionType);
            if (!result.ok) {
                alert(result.reason === 'straddle'
                    ? 'That selection spans more than one existing section - select a range that sits within a single section.'
                    : 'Could not locate that selection in the song.');
                return;
            }
            commitTaggedSong(song);

            const [startTag, endTag] = SECTION_WRAP_TAGS[sectionType];
            chordProText = insertSectionTagsInText(chordProText, range.start, range.end, startTag, endTag);
        }

        document.addEventListener('keydown', (e) => {
            if (!e.ctrlKey || !e.altKey) return;
            // e.code (physical key position, e.g. "KeyV") rather than e.key
            // - on Mac, holding Option remaps e.key to whatever special
            // character that Option+letter combo types under the active
            // keyboard layout (Option+V -> "√" on a US layout, not "v"),
            // so e.key never matched here. e.code ignores modifiers
            // entirely and is the correct choice for a shortcut binding.
            const sectionType = { KeyV: 'verse', KeyC: 'chorus', KeyB: 'bridge', KeyT: 'tab' }[e.code];
            if (!sectionType) return;
            e.preventDefault();
            wrapSelectionInSection(sectionType);
        });

        // --- Transpose ---

        const SHARP_NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const FLAT_NOTES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
        const NOTE_TO_INDEX = {};
        SHARP_NOTES.forEach((n, i) => { NOTE_TO_INDEX[n] = i; });
        FLAT_NOTES.forEach((n, i) => { NOTE_TO_INDEX[n] = i; });

        // Shifts one note name by `semitones`, keeping its own flat/sharp
        // spelling preference (a flat root stays spelled with flats after
        // transposing; anything else - sharp or natural - is respelled with
        // sharps) rather than picking a single scale for the whole song.
        function transposeNoteName(note, semitones) {
            const idx = NOTE_TO_INDEX[note];
            if (idx == null) return null;
            const preferFlat = note.length > 1 && note[1] === 'b';
            const newIdx = ((idx + semitones) % 12 + 12) % 12;
            return (preferFlat ? FLAT_NOTES : SHARP_NOTES)[newIdx];
        }

        // Transposes a full chord name - root, quality suffix untouched,
        // and an optional "/bass" slash note transposed independently of
        // the root (e.g. "D/F#" -> "D#/G" going up a semitone).
        function transposeChordName(name, semitones) {
            if (!name) return name;
            const m = name.match(/^([A-G])([#b]?)(.*)$/);
            if (!m) return name;
            const [, root, acc, rest] = m;
            const rootNote = transposeNoteName(root + acc, semitones);
            if (rootNote == null) return name;
            const slash = rest.match(/^(.*)\/([A-G])([#b]?)$/);
            if (slash) {
                const [, quality, bassRoot, bassAcc] = slash;
                const bassNote = transposeNoteName(bassRoot + bassAcc, semitones);
