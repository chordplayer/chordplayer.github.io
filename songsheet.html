        document.getElementById('sourceViewSource').addEventListener('change', () => {
            renderActive();
            restorePlayChordsForMode();
        });
        document.getElementById('sourceViewTagged').addEventListener('change', () => {
            renderActive();
            restorePlayChordsForMode();
        });

        // Choosing Sheet or Raw is the trigger to convert the pasted text
        // into a song, the first time either is chosen with nothing loaded
        // yet - whichever one you clicked is respected as-is (unlike a
        // file/drop load, which always resets to the Sheet+Chordplayer
        // defaults - see loadNewSource), so picking Raw first lands you in
        // Raw, not bounced back to Sheet.
        function handleViewModeChange() {
            if (!sourceLoaded) {
                if (ingestSource(document.getElementById('rawPane').value)) finishLoad();
                return;
            }
            renderActive();
            restorePlayChordsForMode();
        }
        document.getElementById('viewModeRaw').addEventListener('change', handleViewModeChange);
        document.getElementById('viewModeSheet').addEventListener('change', handleViewModeChange);
        document.getElementById('playChordsToggle').addEventListener('change', () => {
            const showTagged = document.getElementById('sourceViewTagged').checked;
            const showSheet = document.getElementById('viewModeSheet').checked;
            if (showTagged && showSheet) {
                lastPlayChordsInSheetMode = document.getElementById('playChordsToggle').checked;
            }

            // Take effect immediately if playback is already running,
            // rather than only on the next Scroll press - re-derive the
            // live chord schedule from the current playback position
            // (same lookup beginCountInThenScroll uses for a mid-song
            // resume), so checking it back on picks up the schedule from
            // here rather than replaying everything already passed.
            if (isScrolling || isCountingIn) {
                chordSchedule = document.getElementById('playChordsToggle').checked ? currentChordScheduleFull : [];
                chordScheduleIndex = chordSchedule.findIndex(c => c.measurePosition >= songElapsedMeasures);
                if (chordScheduleIndex === -1) chordScheduleIndex = chordSchedule.length;
            }
        });
        document.getElementById('printDiagramsCheck').addEventListener('change', renderActive);

        document.getElementById('chordDurationSelect').addEventListener('change', regenerateTaggedFromSource);
        document.getElementById('simplifyToggle').addEventListener('change', renderActive);
        document.getElementById('legendShowNotes').addEventListener('change', renderLegend);
        document.getElementById('legendShowIntervals').addEventListener('change', renderLegend);

        // Typing is only possible while "With Time Tags" is selected
        // (Source is read-only once loaded - see syncPaneDisplay); sync
        // keystrokes into the in-memory tagged buffer as they happen, but
        // only re-render the sheet on blur so the sheet doesn't jump around
        // mid-edit.
        const rawPaneEl = document.getElementById('rawPane');
        rawPaneEl.addEventListener('input', () => {
            if (!sourceLoaded || rawPaneEl.readOnly) return;
            chordPlayerText = rawPaneEl.value;
            tagsDirty = true;
        });
        rawPaneEl.addEventListener('blur', () => {
            if (!sourceLoaded || document.getElementById('sourceViewSource').checked) return;
            renderActive();
        });

        // --- Click-to-adjust chord duration ---
        //
        // Clicking a chord's own label in the sheet (only while viewing
        // "ChordPlayer" - see syncPaneDisplay's tags-editable class) pops up a
        // -/+ stepper for that one chord's {cpl_m:D} duration, in 0.25-
        // measure steps, floored at 0. If the chord has no explicit tag
        // yet, the first click starts from whatever it's currently using
        // (the "Auto chord duration" setting) rather than an arbitrary
        // default, so the very first click doesn't jump its timing.
        const CHORD_DURATION_STEP = 0.25;
        let durationPopupState = null; // { lineIdx, chordIdx }

        function collectSongLines(song) {
            const lines = [];
            for (const section of song.sections) {
                if (section.type === 'tab') continue;
                for (const line of section.lines) {
                    if (line.type === 'line') lines.push(line);
                }
            }
            return lines;
        }

        // Re-parses the tagged buffer (the only mutable copy) and locates
        // one specific line by lineIdx - the same addressing the rendered
        // chord-label spans carry as a data attribute. Returns null if the
        // buffer has since changed shape out from under that address (e.g.
        // stale popup after a reload).
        function findTaggedChordLine(lineIdx) {
            const song = parseChordPro(chordPlayerText);
            const line = collectSongLines(song)[lineIdx];
            if (!line) return null;
            return { song, line };
        }

        // Same, but also locates one specific chord instance by chordIdx
        // within that line (its position in index-sorted order, matching
        // the chord-label's data-chord-idx).
        function findTaggedChord(lineIdx, chordIdx) {
            const found = findTaggedChordLine(lineIdx);
            if (!found) return null;
            const chords = [...found.line.chords].sort((a, b) => a.index - b.index);
            const chord = chords[chordIdx];
            if (!chord) return null;
            return { song: found.song, line: found.line, chord };
        }

        // Re-serializes an edited parse back into the tagged buffer and
        // re-renders - shared by both duration and chord-name edits.
        function commitTaggedSong(song) {
            const chordDurationMeasures = parseFloat(document.getElementById('chordDurationSelect').value);
            const timing = computeMeasureTiming(song, chordDurationMeasures);
            chordPlayerText = buildTaggedChordPro(song, timing);
            tagsDirty = true;
            renderActive();
        }

        // Adjusts one chord's {cpl_m:D} duration - the parse -> mutate ->
        // recompute -> serialize round trip means the duration-only cascade
        // (position is always derived, never stored) reflows every later
        // chord automatically.
        function adjustChordDuration(lineIdx, chordIdx, delta) {
            const found = findTaggedChord(lineIdx, chordIdx);
            if (!found) return null;
            const { song, chord } = found;
            const chordDurationMeasures = parseFloat(document.getElementById('chordDurationSelect').value);
            const current = chord.measureDuration != null ? chord.measureDuration : chordDurationMeasures;
            const next = Math.max(0, Math.round((current + delta) * 4) / 4);
            chord.measureDuration = next;
            commitTaggedSong(song);
            return next;
        }

        // Renames the chord itself (the [X] bracket content) at one
        // specific position - e.g. typing "Cm" over a "G". Strips
        // characters that would break ChordPro bracket/tag syntax; leaves
        // the chord's duration untouched. Renders through the normal
        // pipeline, so the chord-diagram legend picks up the new chord
        // automatically.
        // An empty name is valid - it blanks the chord to silence (see
        // deleteChordAt) while keeping its own position and duration, so
        // typing a chord's name away entirely is a deliberate way to mute
        // that one measure without disturbing the song's overall timing.
        function renameChordAt(lineIdx, chordIdx, rawName) {
            const name = rawName.replace(/[[\]{}]/g, '').trim();
            const found = findTaggedChord(lineIdx, chordIdx);
            if (!found) return null;
            const { song, chord } = found;
            if (chord.chord === name) return name;
            chord.chord = name;
            commitTaggedSong(song);
            return name;
        }

        // Every chord in the song, addressed and in true document order
        // (sections -> lines -> chords sorted by index) - the same
        // sequence computeMeasureTiming assigns increasing measure
        // positions to, so "the previous chord" here always means the same
        // thing as "the previous chord in song time", even across a line
        // break. Used by deleteChordAt to find who inherits a deleted
        // chord's duration.
        function flattenTaggedChords(song) {
            const flat = [];
            collectSongLines(song).forEach((line, lineIdx) => {
                const sorted = [...line.chords].sort((a, b) => a.index - b.index);
                sorted.forEach((chord, chordIdx) => flat.push({ lineIdx, chordIdx, chord, line }));
            });
            return flat;
        }

        // Removes one chord instance - its duration is handed to whichever
        // chord comes right before it in song time (possibly on an earlier
        // line), which simply extends to cover the time the deleted chord
        // held, rather than shortening the song. The very first chord in
        // the song has nothing before it to extend, so it can't be removed
        // outright without shortening the song - instead it's blanked to a
        // nameless, silent measure (an empty [] - see playChordByName,
        // which simply finds no voicing for '' and plays nothing) that
        // keeps its own position and duration, preserving the song's
        // overall timing.
        function deleteChordAt(lineIdx, chordIdx) {
            const found = findTaggedChord(lineIdx, chordIdx);
            if (!found) return false;
            const { song, line, chord } = found;
            const chordDurationMeasures = parseFloat(document.getElementById('chordDurationSelect').value);
            const deletedDuration = chord.measureDuration != null ? chord.measureDuration : chordDurationMeasures;

            const flat = flattenTaggedChords(song);
            const myFlatIdx = flat.findIndex((f) => f.chord === chord);
            const prev = myFlatIdx > 0 ? flat[myFlatIdx - 1] : null;

            if (!prev) {
                chord.chord = '';
                commitTaggedSong(song);
                return true;
            }

            const prevDuration = prev.chord.measureDuration != null ? prev.chord.measureDuration : chordDurationMeasures;
            prev.chord.measureDuration = prevDuration + deletedDuration;
            line.chords = line.chords.filter((c) => c !== chord);
            commitTaggedSong(song);
            return true;
        }

        // Inserts a brand-new "C" chord by SPLITTING whichever existing
        // chord's own time span the click landed in, rather than adding a
        // fresh full/auto-duration chord - so the song's overall length,
        // and every later chord's timing, is completely unaffected. The
        // held (previous) chord's duration shrinks to end at the click
        // point (snapped to the nearest quarter-measure tick, the same
        // granularity the -/+ duration stepper uses); the new chord picks
        // up exactly the remainder, up to where the held chord used to
        // end - e.g. splitting a full-measure chord at its middle leaves
        // two half-measure chords, splitting a half-measure chord at its
        // middle leaves two quarter-measure chords.
        //
        // targetChordIdx is the click's index-sorted slot (see
        // findInsertionGap) - the held chord is whatever sits right before
        // it. If there's nothing before it (click landed before the very
        // first chord on the line), there's no span to split, so this
        // falls back to a plain auto-duration insert instead (same as
        // typing a fresh chord into the source).
        function insertChordAt(lineIdx, targetChordIdx, clientX) {
            const found = findTaggedChordLine(lineIdx);
            if (!found) return null;
            const { song, line } = found;
            const sorted = [...line.chords].sort((a, b) => a.index - b.index);
            const chordDurationMeasures = parseFloat(document.getElementById('chordDurationSelect').value);
            const lt = currentLineTimings[lineIdx];
            const heldCp = targetChordIdx > 0 && lt ? lt.chordPositions[targetChordIdx - 1] : null;

            let newIndex, newDuration;
            if (!heldCp) {
                const prevIdx = targetChordIdx > 0 ? sorted[targetChordIdx - 1].index : 0;
                const nextIdx = targetChordIdx < sorted.length ? sorted[targetChordIdx].index : line.lyric.length;
                newIndex = Math.max(0, Math.min(Math.round((prevIdx + nextIdx) / 2), line.lyric.length));
                newDuration = chordDurationMeasures;
            } else {
                const heldStart = heldCp.measurePosition;
                const heldEnd = heldStart + heldCp.measureDuration;

                // Where the click landed within the held chord's own
                // rendered span - between its own label and whichever
                // label (or the grid's right edge) comes right after it.
                const labels = Array.from(document.querySelectorAll(`#sheetPane .chord-label[data-line-idx="${lineIdx}"]`))
                    .sort((a, b) => parseInt(a.dataset.chordIdx, 10) - parseInt(b.dataset.chordIdx, 10));
                const heldLabel = labels[targetChordIdx - 1];
                const nextLabel = labels[targetChordIdx];
                const heldLeft = heldLabel.getBoundingClientRect().left;
                const rightEdge = nextLabel
                    ? nextLabel.getBoundingClientRect().left
                    : heldLabel.closest('.sheet-chords-grid').getBoundingClientRect().right;
                const frac = rightEdge > heldLeft ? Math.max(0, Math.min(1, (clientX - heldLeft) / (rightEdge - heldLeft))) : 0.5;

                let splitPoint = Math.round((heldStart + frac * (heldEnd - heldStart)) * 4) / 4;
                splitPoint = Math.max(heldStart + 0.25, Math.min(splitPoint, heldEnd - 0.25));
                if (splitPoint <= heldStart || splitPoint >= heldEnd) return null; // no room to split

                const heldChordObj = sorted[targetChordIdx - 1];
                heldChordObj.measureDuration = splitPoint - heldStart;
                newDuration = heldEnd - splitPoint;

                const nextIdx = targetChordIdx < sorted.length ? sorted[targetChordIdx].index : line.lyric.length;
                newIndex = Math.max(0, Math.min(Math.round((heldChordObj.index + nextIdx) / 2), line.lyric.length));
            }

            const newChord = { chord: 'C', index: newIndex, measureDuration: newDuration };
            sorted.splice(targetChordIdx, 0, newChord);
            line.chords = sorted;
            commitTaggedSong(song);
            return targetChordIdx;
        }

        // Local pixels-per-measure at one chord's position on its line -
        // used to turn a drag's raw pixel delta into a measure delta (see
        // nudgeChordTiming). Estimated from the rendered distance to
        // whichever immediate neighbor is available (preferring the next
        // chord, falling back to the previous one) - a chord alone on its
        // line with no same-line neighbor in either direction has nothing
        // to estimate a scale from, so dragging it is a no-op.
        function estimateLocalPixelsPerMeasure(lineIdx, chordIdx) {
            const lt = currentLineTimings[lineIdx];
            if (!lt) return null;
            const labels = Array.from(document.querySelectorAll(`#sheetPane .chord-label[data-line-idx="${lineIdx}"]`))
                .sort((a, b) => parseInt(a.dataset.chordIdx, 10) - parseInt(b.dataset.chordIdx, 10));
            const thisLabel = labels[chordIdx];
            const thisCp = lt.chordPositions[chordIdx];
            if (!thisLabel || !thisCp) return null;
            const neighborIdx = chordIdx + 1 < labels.length ? chordIdx + 1 : chordIdx - 1;
            const neighborLabel = labels[neighborIdx];
            const neighborCp = lt.chordPositions[neighborIdx];
            if (!neighborLabel || !neighborCp) return null;
            const measureDist = neighborCp.measurePosition - thisCp.measurePosition;
            if (!measureDist) return null;
            return (neighborLabel.getBoundingClientRect().left - thisLabel.getBoundingClientRect().left) / measureDist;
        }

        // Dragging a chord left/right nudges WHEN it starts, snapped to the
        // nearest quarter-measure tick, by moving the boundary between it
        // and whichever chord precedes it in song time (possibly on an
        // earlier line - see flattenTaggedChords): the dragged chord's own
        // duration shrinks/grows by the same amount its start moved (its
        // END stays fixed), and the preceding chord's duration absorbs the
        // opposite change - so the dragged chord's own end, and everything
        // after it, never moves. Clamped so neither chord's duration drops
        // below one quarter-measure tick, and a no-op if there's no
        // preceding chord at all (the very first chord in the song defines
        // measure 0 - nothing to borrow time from/give time to).
        function nudgeChordTiming(lineIdx, chordIdx, deltaMeasures) {
            const found = findTaggedChord(lineIdx, chordIdx);
            if (!found) return false;
            const { song, chord } = found;
            const chordDurationMeasures = parseFloat(document.getElementById('chordDurationSelect').value);
            const oldDuration = chord.measureDuration != null ? chord.measureDuration : chordDurationMeasures;

            const flat = flattenTaggedChords(song);
            const myFlatIdx = flat.findIndex((f) => f.chord === chord);
            const prevEntry = myFlatIdx > 0 ? flat[myFlatIdx - 1] : null;
            if (!prevEntry) return false;
            const prevDuration = prevEntry.chord.measureDuration != null ? prevEntry.chord.measureDuration : chordDurationMeasures;

            let delta = Math.round(deltaMeasures * 4) / 4;
            delta = Math.max(delta, 0.25 - prevDuration);
            delta = Math.min(delta, oldDuration - 0.25);
            if (!delta) return false;

            chord.measureDuration = oldDuration - delta;
            prevEntry.chord.measureDuration = prevDuration + delta;
            commitTaggedSong(song);
            return true;
        }

        function updateDurationPopupValue(value) {
            document.getElementById('durationPopupValue').textContent = String(value);
        }

        function positionDurationPopup(targetEl) {
            const popup = document.getElementById('durationPopup');
            const rect = targetEl.getBoundingClientRect();
            const popupRect = popup.getBoundingClientRect();
            let left = rect.left + rect.width / 2 - popupRect.width / 2;
            left = Math.max(4, Math.min(left, window.innerWidth - popupRect.width - 4));
            popup.style.left = `${left}px`;
            popup.style.top = `${rect.bottom + 6}px`;
        }

        function showDurationPopup(targetEl, lineIdx, chordIdx) {
            const chordDurationMeasures = parseFloat(document.getElementById('chordDurationSelect').value);
            const lt = currentLineTimings[lineIdx];
            const cp = lt && lt.chordPositions[chordIdx];
            const current = cp ? cp.measureDuration : chordDurationMeasures;

            durationPopupState = { lineIdx, chordIdx };
            document.getElementById('durationPopupChord').value = targetEl.textContent;
            updateDurationPopupValue(current);

            const popup = document.getElementById('durationPopup');
            popup.style.display = 'flex';
            positionDurationPopup(targetEl);
        }

        function hideDurationPopup() {
            durationPopupState = null;
            document.getElementById('durationPopup').style.display = 'none';
        }

        function stepDurationPopup(delta) {
            if (!durationPopupState) return;
            const { lineIdx, chordIdx } = durationPopupState;
            const next = adjustChordDuration(lineIdx, chordIdx, delta);
            if (next == null) { hideDurationPopup(); return; }
            durationPopupState = { lineIdx, chordIdx };
            updateDurationPopupValue(next);
            const target = document.querySelector(`#sheetPane .chord-label[data-line-idx="${lineIdx}"][data-chord-idx="${chordIdx}"]`);
            if (target) positionDurationPopup(target);
        }

        function commitDurationPopupChordName() {
            if (!durationPopupState) return;
            const { lineIdx, chordIdx } = durationPopupState;
            const input = document.getElementById('durationPopupChord');
            const applied = renameChordAt(lineIdx, chordIdx, input.value);
            if (applied == null) { hideDurationPopup(); return; }
            durationPopupState = { lineIdx, chordIdx };
            input.value = applied;
            const target = document.querySelector(`#sheetPane .chord-label[data-line-idx="${lineIdx}"][data-chord-idx="${chordIdx}"]`);
            if (target) positionDurationPopup(target);
        }

        document.getElementById('durationPopupMinus').addEventListener('click', () => stepDurationPopup(-CHORD_DURATION_STEP));
        document.getElementById('durationPopupPlus').addEventListener('click', () => stepDurationPopup(CHORD_DURATION_STEP));
        document.getElementById('durationPopupChord').addEventListener('change', commitDurationPopupChordName);
        document.getElementById('durationPopupChord').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') e.target.blur();
        });
        document.getElementById('durationPopupDelete').addEventListener('click', () => {
            if (!durationPopupState) return;
            const { lineIdx, chordIdx } = durationPopupState;
            deleteChordAt(lineIdx, chordIdx);
            hideDurationPopup();
        });

        // Which index-sorted slot a horizontal position falls into on one
        // line - shared by inserting a new chord (see the empty-space click
        // handler below) and dropping a dragged one (see the pointerup
        // handler below, which passes excludeChordIdx so the dragged
        // chord's own current slot doesn't skew the comparison). Compares
        // against the ACTUAL rendered chord-label positions rather than
        // recomputing character/measure math, so it works identically for
        // both the lyric-anchored and even (chord-only) grid layouts.
        function findInsertionGap(lineIdx, clientX, excludeChordIdx) {
            const labels = Array.from(document.querySelectorAll(`#sheetPane .chord-label[data-line-idx="${lineIdx}"]`))
                .filter((el) => parseInt(el.dataset.chordIdx, 10) !== excludeChordIdx)
                .sort((a, b) => parseInt(a.dataset.chordIdx, 10) - parseInt(b.dataset.chordIdx, 10));
            for (let i = 0; i < labels.length; i++) {
                if (clientX < labels[i].getBoundingClientRect().left + labels[i].getBoundingClientRect().width / 2) return i;
            }
            return labels.length;
        }

        // Drag-to-reorder state for the chord-label pointer handlers below.
        // A real drag vs. a plain click (which opens the duration popup) is
        // disambiguated by a small movement threshold - see pointermove.
        let chordDragState = null; // { lineIdx, chordIdx, pointerId, startX, moved, el }
        let suppressNextChordClick = false;

        document.getElementById('sheetPane').addEventListener('pointerdown', (e) => {
            if (!document.getElementById('sourceViewTagged').checked) return;
            const target = e.target.closest('.chord-label');
            if (!target) return;
            const lineIdx = parseInt(target.dataset.lineIdx, 10);
            const chordIdx = parseInt(target.dataset.chordIdx, 10);
            if (isNaN(lineIdx) || isNaN(chordIdx)) return;
            chordDragState = { lineIdx, chordIdx, pointerId: e.pointerId, startX: e.clientX, moved: false, el: target };
        });

        document.getElementById('sheetPane').addEventListener('pointermove', (e) => {
            if (!chordDragState || e.pointerId !== chordDragState.pointerId) return;
            const dx = e.clientX - chordDragState.startX;
            if (!chordDragState.moved && Math.abs(dx) > 4) {
                chordDragState.moved = true;
                chordDragState.el.classList.add('dragging');
                chordDragState.el.setPointerCapture(chordDragState.pointerId);
            }
            if (chordDragState.moved) {
                chordDragState.el.style.transform = `translateX(${dx}px)`;
            }
        });

        function endChordDrag(e) {
            if (!chordDragState || e.pointerId !== chordDragState.pointerId) return;
            const { lineIdx, chordIdx, moved, el, startX } = chordDragState;
            el.style.transform = '';
            el.classList.remove('dragging');
            if (el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
            chordDragState = null;
            if (moved) {
                suppressNextChordClick = true;
                const scale = estimateLocalPixelsPerMeasure(lineIdx, chordIdx);
                if (scale) nudgeChordTiming(lineIdx, chordIdx, (e.clientX - startX) / scale);
            }
        }
        document.getElementById('sheetPane').addEventListener('pointerup', endChordDrag);
        document.getElementById('sheetPane').addEventListener('pointercancel', endChordDrag);

        document.getElementById('sheetPane').addEventListener('click', (e) => {
            if (suppressNextChordClick) { suppressNextChordClick = false; return; }
            if (!document.getElementById('sourceViewTagged').checked) return;

            const target = e.target.closest('.chord-label');
            if (target) {
                const lineIdx = parseInt(target.dataset.lineIdx, 10);
                const chordIdx = parseInt(target.dataset.chordIdx, 10);
                if (isNaN(lineIdx) || isNaN(chordIdx)) return;
                e.stopPropagation();
                showDurationPopup(target, lineIdx, chordIdx);
                return;
            }

            // Shift-click on the tick-marks row (not the chord-name row
            // below it, and not a plain click - too easy to fire by
            // accident) inserts a new chord there - see insertChordAt. The
            // tick row is the click target specifically so the cursor can
            // land precisely on a tick, rather than aiming through the
            // chord names themselves; the x position is the same either
            // way, so findInsertionGap/insertChordAt need no changes.
            if (!e.shiftKey) return;
            const ticks = e.target.closest('.sheet-ticks');
            const lineEl = ticks && ticks.closest('.sheet-line');
            const lineIdx = lineEl ? parseInt(lineEl.dataset.lineIdx, 10) : NaN;
            if (isNaN(lineIdx)) return;
            e.stopPropagation();
            const targetChordIdx = findInsertionGap(lineIdx, e.clientX);
            insertChordAt(lineIdx, targetChordIdx, e.clientX);
            const newTarget = document.querySelector(`#sheetPane .chord-label[data-line-idx="${lineIdx}"][data-chord-idx="${targetChordIdx}"]`);
            if (newTarget) {
                showDurationPopup(newTarget, lineIdx, targetChordIdx);
                const nameInput = document.getElementById('durationPopupChord');
                nameInput.focus();
                nameInput.select();
            }
        });

        // Right-click a chord to designate it as where the *next* Scroll
        // press should start from (see beginCountInThenScroll) - right-
        // clicking the already-marked chord clears it instead of
        // re-marking it.
        document.getElementById('sheetPane').addEventListener('contextmenu', (e) => {
            const target = e.target.closest('.chord-label');
            if (!target || !document.getElementById('sourceViewTagged').checked) return;
            const lineIdx = parseInt(target.dataset.lineIdx, 10);
            const chordIdx = parseInt(target.dataset.chordIdx, 10);
            if (isNaN(lineIdx) || isNaN(chordIdx)) return;
            e.preventDefault();
            if (resumePointChord && resumePointChord.lineIdx === lineIdx && resumePointChord.chordIdx === chordIdx) {
                resumePointChord = null;
            } else {
                resumePointChord = { lineIdx, chordIdx };
            }
            updateResumeFlashDOM();
        });

        // Manually repositioning the sheet while stopped (no explicit
        // right-click mark) changes the implicit "resume from wherever
        // scrolled" point - keep the flash tracking it live. Cheap no-op
        // while actively playing (updateResumeFlashDOM's own guard), so no
        // need to filter out the scrollTop writes scrollStep makes each
        // frame during playback.
        document.getElementById('sheetPane').addEventListener('scroll', () => {
            updateResumeFlashDOM();
        });

        document.addEventListener('click', (e) => {
            const popup = document.getElementById('durationPopup');
            if (popup.style.display === 'none') return;
            if (popup.contains(e.target)) return;
            hideDurationPopup();
        });

        // "Load Song..." always uses the plain <input type=file>,
        // in every browser - the File System Access API's showOpenFilePicker
        // was tried here too (to grab a writable handle for in-place Save),
        // but it opens its own separate, initially-empty "last folder"
        // memory, which threw away the input element's already-established
        // one. A file loaded this way has no handle, so Save always starts
        // with a one-time showSaveFilePicker prompt (see performSave) - it
        // remembers its own last folder across saves from then on. Drag/drop
        // still opportunistically grabs a real handle below since that path
        // has no folder-memory picker to break.
        const fsaSupported = typeof window.showOpenFilePicker === 'function';

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => loadNewSource(ev.target.result, { fileName: file.name });
            reader.readAsText(file);
        });

        const dropZone = document.getElementById('rawPane');
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
        dropZone.addEventListener('drop', async (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const item = e.dataTransfer.items && e.dataTransfer.items[0];
            if (fsaSupported && item && typeof item.getAsFileSystemHandle === 'function') {
                const handle = await item.getAsFileSystemHandle();
                if (handle && handle.kind === 'file') {
                    const file = await handle.getFile();
                    const text = await file.text();
                    loadNewSource(text, { fileName: file.name, fileHandle: handle });
                    return;
                }
            }
            const file = e.dataTransfer.files && e.dataTransfer.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => loadNewSource(ev.target.result, { fileName: file.name });
            reader.readAsText(file);
        });
    </script>
</body>
</html>
